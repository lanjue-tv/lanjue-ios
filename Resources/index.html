/* ---------- 源站搜索：全源并发，最快源优先 ---------- */
// 片名归一化：去空格与标点，用于「同名合并」和「关键词命中」判断
function normKw(x) {
  return String(x || '').toLowerCase()
    .replace(/[\s\u3000]+/g, '')
    .replace(/[·・.,，。、:：;；!！?？'"“”‘’()（）\[\]【】《》〈〉<>_—\-~～|/\\]/g, '');
}

// 源优先级：实测带宽为主，码率、首包次之。没测过的源 rank≈0，排最后
function siteRankKey(s) {
  const m = METRICS[s.api] || {};
  // 还没测过的给个中间分：否则永远排在测过的后面，一辈子轮不到它测
  if (!m.speed && !m.mbps) return 55 + rankSite(s) * -0.01;
  return (m.speed || 0) * 100 + (m.mbps || 0) * 2 + (m.ttfb ? Math.max(0, 6 - m.ttfb / 400) : 0);
}

let searchSeq = 0, searchTimer = 0, searchState = null;

// 全部可用源，按实测速度从快到慢（同一上游域名只留一个，避免重复测同一个站）
// 精选优先：实测"极速"且 1080P/4K 的源排最前，其次极速，其余按速度
function favTier(s) {
  const m = METRICS[s.api];
  if (!m || !m.speed) return 0;
  const sp = speedTier(m), q = qualTier(m);
  if (sp && sp.k >= 2) return (q && q.k >= 2) ? 2 : 1;
  return 0;
}
function searchPool() {
  const seen = {}, pool = [];
  state.warehouses.forEach(w => w.sites.forEach(s => {
    if (!s.ok || s.searchable === false) return;
    const host = String(s.api).replace(/^https?:\/\//i, '').split('/')[0].toLowerCase();
    if (seen[host]) return;
    seen[host] = 1;
    pool.push({ w, s, rank: siteRankKey(s), fav: favTier(s) });
  }));
  pool.sort((a, b) => (b.fav - a.fav) || (b.rank - a.rank));
  return pool;
}

async function doSiteSearch(kw) {
  const q = normKw(kw);
  if (!q) return;
  const my = ++searchSeq;
  if (searchTimer) { clearTimeout(searchTimer); searchTimer = 0; }
  const pool = searchPool();
  if (!pool.length) {
    $('#searchBody').innerHTML = '<div class="empty-sm">还没有可用的源站</div>';
    return;
  }
  const list = pool.slice(0, 14);
  searchState = { q, kw, got: [], done: 0, hit: 0, total: list.length, probing: false };
  $('#searchBody').innerHTML = `<div class="srhd" id="searchProg">正在并发搜索 ${list.length} 个源站…</div>
    <div class="pgrid" id="searchGrid"></div>`;

  const paint = force => {
    if (my !== searchSeq) return;
    if (force) {
      if (searchTimer) { clearTimeout(searchTimer); searchTimer = 0; }
      renderSearchOut();
      return;
    }
    if (searchTimer) return;
    searchTimer = setTimeout(() => {
      searchTimer = 0;
      if (my === searchSeq) renderSearchOut();
    }, 260);
  };

  let qi = 0;
  const worker = async () => {
    while (qi < list.length) {
      const t = list[qi++];
      try {
        const j = await getJSON(apiUrl(t.s.api, 'ac=videolist&wd=' + encodeURIComponent(kw)), 5000);
        // 有的源不认 wd，会把整个片库返回来。只留片名真的含关键词的，否则首页全是杂质
        const items = (j.list || []).filter(v => v && v.vod_name && normKw(v.vod_name).indexOf(q) >= 0);
        if (items.length) {
          searchState.hit++;
          const m = METRICS[t.s.api] || {};
          items.slice(0, 12).forEach(v => searchState.got.push({
            id: String(v.vod_id), name: String(v.vod_name), pic: v.vod_pic || '',
            rem: v.vod_remarks || '', site: t.s, rank: t.rank,
            res: m.res || '', mbps: m.mbps || 0, speed: m.speed || 0, cnt: items.length
          }));
        }
      } catch (e) {}
      searchState.done++;
      paint(0);
    }
  };
  await Promise.all(Array.from({ length: Math.min(14, list.length) }, worker));
  paint(1);
  // 命中的源后台补测档位（不挡首屏）
  probeSearchHits();
  // 第二轮：剩下的源接着搜，结果直接并进来 —— 既保住首屏速度，又不漏掉好源
  const rest = pool.slice(list.length, list.length + 26);
  if (rest.length && my === searchSeq) {
    searchState.total += rest.length;
    let ri = 0;
    const w2 = async () => {
      while (ri < rest.length) {
        const t = rest[ri++];
        try {
          const j = await getJSON(apiUrl(t.s.api, 'ac=videolist&wd=' + encodeURIComponent(kw)), 6000);
          const items = (j.list || []).filter(v => v && v.vod_name && normKw(v.vod_name).indexOf(q) >= 0);
          if (items.length) {
            searchState.hit++;
            const m = METRICS[t.s.api] || {};
            items.slice(0, 12).forEach(v => searchState.got.push({
              id: String(v.vod_id), name: String(v.vod_name), pic: v.vod_pic || '',
              rem: v.vod_remarks || '', site: t.s, rank: t.rank,
              res: m.res || '', mbps: m.mbps || 0, speed: m.speed || 0, cnt: items.length
            }));
          }
        } catch (e) {}
        searchState.done++;
        paint(0);
      }
    };
    await Promise.all(Array.from({ length: Math.min(8, rest.length) }, w2));
    paint(1);
    probeSearchHits();
  }
}

/* 候选排序：极速组内 4K>1080P>720P>480P，然后中速组、慢速组（速度优先，画质其次，没测过垫底）
   即：4K极速 > 1080P极速 > 720P极速 > 480P极速 > 4K中速 > … */
function candSortKey(v) {
  const s = speedTier(v);
  return [s ? s.k : -1, qualKey(v), v.rank || 0, v.cnt || 0];
}
function cmpCand(a, b) {
  const ka = candSortKey(a), kb = candSortKey(b);
  for (let i = 0; i < ka.length; i++) { if (kb[i] !== ka[i]) return kb[i] - ka[i]; }
  return 0;
}
// 换源时按片名取候选（搜索结果里缓存；没搜过就现场并发搜一遍）
const titleCands = new Map();

/* 搜索命中后补测：直接拿"这部片"的地址量，别拿别的片凑数。
   测完把档位标在卡片上，顺便让 4K/1080P 极速源自动浮到最前。 */
/* 每部片的实测指标（按 源api|片id 存），跟"源整体速度"分开。
   之前卡片用的是源级指标，拿别的片测出来的 1080P 贴在另一部片身上，
   点进去再一测就变 720P —— 两边对不上就是这里来的。 */
const HITM = Object.create(null);
const HITM_KEY = 'lanjue.hitm';
const HIT_TTL = 30 * 60000;
(function loadHitm() {
  try {
    const j = JSON.parse(localStorage.getItem(HITM_KEY) || 'null');
    if (j && typeof j === 'object') {
      const now = Date.now();
      Object.keys(j).forEach(k => { if (j[k] && now - (j[k].at || 0) < HIT_TTL) HITM[k] = j[k]; });
    }
  } catch (e) {}
})();
let hitmSaveT = 0;
function hitmSave() {
  if (hitmSaveT) return;
  hitmSaveT = setTimeout(() => {
    hitmSaveT = 0;
    try {
      const ks = Object.keys(HITM).sort((a, b) => (HITM[b].at || 0) - (HITM[a].at || 0)).slice(0, 150);
      const o = {};
      ks.forEach(k => { o[k] = HITM[k]; });
      localStorage.setItem(HITM_KEY, JSON.stringify(o));
    } catch (e) {}
  }, 800);
}
/* ---- 片名 → 各源候选 索引（落盘）----
   点开一部片，比价前得先知道"别的源有没有这部片"，以前每次都现搜 12 个源（2~4 秒）。
   这里把看过的片名和候选源记下来，重复点开/同一部片换源就能 0 毫秒拿到候选清单。
   注意：索引里只有"哪几个源有这片"，谁最优仍然全靠实测决定，不会因为索引旧就选错。 */
const IDX = Object.create(null);
const IDX_KEY = 'lanjue.idx.v2';
const IDX_TTL = 7 * 86400000;
const IDX_MAX = 700;
(function loadIdx() {
  try {
    const j = JSON.parse(localStorage.getItem(IDX_KEY) || 'null');
    if (!j || typeof j !== 'object') return;
    const now = Date.now();
    Object.keys(j).forEach(k => {
      const arr = (j[k] || []).filter(x => x && x.k && x.i && now - (x.t || 0) < IDX_TTL);
      if (arr.length) IDX[k] = arr;
    });
  } catch (e) {}
})();
let idxSaveT = 0;
function idxSave() {
  if (idxSaveT) return;
  idxSaveT = setTimeout(() => {
    idxSaveT = 0;
    try {
      const ks = Object.keys(IDX).sort((a, b) => idxAt(b) - idxAt(a)).slice(0, IDX_MAX);
      const o = {};
      ks.forEach(k => { o[k] = IDX[k]; });
      localStorage.setItem(IDX_KEY, JSON.stringify(o));
    } catch (e) {}
  }, 1200);
}
function idxAt(k) {
  let t = 0;
  (IDX[k] || []).forEach(x => { if ((x.t || 0) > t) t = x.t || 0; });
  return t;
}
function idxAdd(name, site, id, pic) {
  if (!name || !site || !id) return;
  const q = normKw(name);
  if (!q) return;
  const arr = IDX[q] || (IDX[q] = []);
  const sk = String(site.key);
  const i = arr.findIndex(x => String(x.k) === sk);
  const rec = { k: sk, i: String(id), p: pic || '', t: Date.now() };
  if (i >= 0) arr[i] = rec; else arr.unshift(rec);
  if (arr.length > 6) arr.length = 6;
  idxSave();
}
/* 列表铺完顺手喂索引：不花任何网络，纯本地记账 */
function idxSeedFromList(list) {
  (list || []).forEach(v => { if (v && v.name && v.siteKey && v.id) idxAdd(v.name, { key: v.siteKey }, v.id, v.pic); });
}
function idxGet(q) {
  const arr = IDX[q];
  if (!arr || !arr.length) return null;
  return arr.slice();
}

/* ---- 该片"已确认的最优源"（落盘，12 小时有效）----
   判过一次最优，下次点开就直接开到那个源上：不用再"先开这个源、几秒后跳过去"，
   也不要再花 4~8 秒重跑一遍比价。过期或实测发现是死流就退回完整比价。 */
const BEST = Object.create(null);
const BEST_KEY = 'lanjue.best.v2';
const BEST_TTL = 12 * 3600000;
const BEST_MAX = 400;
(function loadBest() {
  try {
    const j = JSON.parse(localStorage.getItem(BEST_KEY) || 'null');
    if (!j || typeof j !== 'object') return;
    const now = Date.now();
    Object.keys(j).forEach(k => { if (j[k] && now - (j[k].at || 0) < BEST_TTL) BEST[k] = j[k]; });
  } catch (e) {}
})();
let bestSaveT = 0;
function bestSave() {
  if (bestSaveT) return;
  bestSaveT = setTimeout(() => {
    bestSaveT = 0;
    try {
      const ks = Object.keys(BEST).sort((a, b) => (BEST[b].at || 0) - (BEST[a].at || 0)).slice(0, BEST_MAX);
      const o = {};
      ks.forEach(k => { o[k] = BEST[k]; });
      localStorage.setItem(BEST_KEY, JSON.stringify(o));
    } catch (e) {}
  }, 600);
}
function bestGet(name) {
  const q = normKw(name || '');
  if (!q) return null;
  const e = BEST[q];
  if (!e) return null;
  if (Date.now() - (e.at || 0) > BEST_TTL) { delete BEST[q]; return null; }
  return e;
}
function bestPut(name, site, id, m) {
  if (!name || !site || !id) return;
  const q = normKw(name);
  if (!q) return;
  BEST[q] = { k: String(site.key), i: String(id), res: (m && m.res) || '', speed: (m && m.speed) || 0, mbps: (m && m.mbps) || 0, at: Date.now() };
  bestSave();
}
function siteByKey(k) {
  const sk = String(k || '');
  if (!sk) return null;
  return state.warehouses.map(w => w.sites.find(s => String(s.key) === sk)).filter(Boolean)[0] || null;
}

function hitKey(api, id) { return String(api) + '|' + String(id); }
function hitGet(api, id) {
  const m = HITM[hitKey(api, id)];
  if (!m) return null;
  if (Date.now() - (m.at || 0) > HIT_TTL) return null;
  return m;
}
function hitPut(api, id, m) {
  HITM[hitKey(api, id)] = Object.assign({}, m, { at: Date.now() });
  hitmSave();
}
/* 同一部片、同一个源：有时会换一个 CDN 地址播，新地址不一定带 RESOLUTION。
   这时不该拿码率重新估一档（常被估低），沿用已经量到的真实分辨率，
   否则就成了"搜索卡片写 720P、点进去变 480P"。 */
function keepRes(m, api, id) {
  if (!m) return m;
  const k = api ? hitGet(api, id) : null;
  if (!k) return m;
  if (!String(m.res || '').trim() && String(k.res || '').trim()) m.res = k.res;
  // 还是没有真实分辨率 → 档位只能靠码率推，沿用那次已经定好的码率，
  // 免得换个 CDN 地址就估出另一个档位（卡片 720P、详情 480P 的另一条路径）
  if (!String(m.res || '').trim() && (k.mbps || 0) > 0) m.mbps = k.mbps;
  return m;
}

let searchProbeSeq = 0;
function syncGotMetrics() {
  const st = searchState;
  if (!st) return;
  st.got.forEach(v => {
    // 只用"这部片"的实测值，没有就空着（宁可不显示，也不拿源级数字骗人）
    const m = hitGet(v.site.api, v.id);
    v.res = m && m.res ? m.res : '';
    v.mbps = m && m.mbps ? m.mbps : 0;
    v.speed = m && m.speed ? m.speed : 0;
    v.rank = siteRankKey(v.site);
  });
}
async function probeSearchHits() {
  const st = searchState;
  if (!st) return;
  const seq = ++searchProbeSeq;
  st.probing = true;
  // 按「片名组」挑要量的：精确命中的正片组排最前，把它的每个候选源都量一遍。
  // 之前是"每个源只量它搜到的第一条"，源先返回了别的片，正片候选就漏量了，
  // 排序只能退回源级指标——"第一个不是最优的"就是这么来的。
  const map = new Map();
  st.got.forEach(v => {
    const k = normKw(v.name);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(v);
  });
  const groups = Array.from(map.values()).sort((a, b) => {
    const ea = normKw(a[0].name) === st.q ? 1 : 0, eb = normKw(b[0].name) === st.q ? 1 : 0;
    if (ea !== eb) return eb - ea;
    return b.length - a.length;   // 命中源越多的越可能是正片
  });
  const seenJ = {}, jobs = [];
  for (const g of groups) {
    for (const v of g) {
      const k = hitKey(v.site.api, v.id);
      if (seenJ[k]) continue;
      seenJ[k] = 1;
      if (hitGet(v.site.api, v.id)) continue;   // 这部片已经量过了，别重复花流量
      jobs.push({ site: v.site, id: v.id });
    }
    if (jobs.length >= 14) break;   // 优先把头部片名的候选量完，长尾的随缘
  }
  const list = jobs.slice(0, 14);
  if (!list.length) { st.probing = false; return; }
  let i = 0;
  const worker = async () => {
    while (i < list.length) {
      const job = list[i++];
      try {
        const j = await getJSON(apiUrl(job.site.api, 'ac=videolist&ids=' + encodeURIComponent(job.id)), 9000);
        const v = (j.list || [])[0];
        if (!v) continue;
        // 必须量"详情页会默认播的那条线路的第一集"，否则搜索卡片一个数、点进去另一个数
        const dv = buildDetail(v, job.site);
        const l0 = dv.lines.find(l => l.direct > 0 && l.eps.length) || dv.lines.find(l => l.eps.length);
        const raw = l0 ? l0.eps[0].url : '';
        const u = raw ? await resolvePlayUrl(raw) : '';
        if (!/\.m3u8/i.test(u)) continue;
        const m = await measureStream(u);
        if (m && (m.mbps || m.speed)) {
          const rec = { u, res: m.res || '', mbps: m.mbps || 0, speed: m.speed || 0, ttfb: m.ttfb || 0 };
          hitPut(job.site.api, job.id, rec);           // 这部片的真实指标
          METRICS[job.site.api] = Object.assign({}, METRICS[job.site.api] || {}, m);  // 顺便更新源级（排序用）
          saveMetrics();
        }
      } catch (e) {}
      if (seq === searchProbeSeq && st === searchState) {
        syncGotMetrics();
        try { renderSearchOut(); } catch (e) {}
      }
    }
  };
  await Promise.all(Array.from({ length: Math.min(4, list.length) }, worker));
  // 测完收工：卡片补齐真实码率/速度，把「测速中」换掉
  if (st === searchState) {
    st.probing = false;
    if (seq === searchProbeSeq) { syncGotMetrics(); try { renderSearchOut(); } catch (err) {} }
  }
}

function searchCardHTML(v, i) {
  const best = v.cands[0];
  const pic = best.pic ? `<img src="${esc(best.pic)}" referrerpolicy="no-referrer" loading="lazy"
    onload="this.classList.add('on')" onerror="this.remove()">` : '';
  const badges = [];
  if (i === 0) badges.push('<i class="qtag sbfast">最优</i>');
  else if (v.side) badges.push('<i class="qtag">相关</i>');
  // 只写"极速/1080P"还是太虚：把实测的码率和下载速度一起摆在卡片上
  const nums = [];
  if (best.mbps) nums.push(best.mbps + 'M');
  if (best.speed) nums.push(best.speed + 'MB/s');
  const qtag = tierTag(best);
  if (qtag) badges.push(qtag);
  else if (searchState && searchState.probing) badges.push('<i class="qtag q-ld">测速中…</i>');
  if (nums.length) badges.push('<i class="qtag q-ok">' + esc(nums.join('·')) + '</i>');
  const sn = String(best.site.name || '').replace(/[┃|]/g, '').trim();
  const alt = v.cands.length > 1 ? ' 等' + v.cands.length + '源' : '';
  return `<article class="pcard" data-idx="${i}">
    <div class="ph">${esc(v.name)}</div>${pic}
    <div class="sbtop">${badges.join('')}</div>
    <div class="pt spt"><span>${esc(v.name)}</span><small>${esc(sn)}${alt}</small></div>
  </article>`;
}

function renderSearchOut() {
  const st = searchState;
  if (!st) return;
  const body = $('#searchBody');
  if (!body) return;

  // 同一个片名：把所有搜到它的源都收进来，按「画质档 → 速度档」排，留前 3 个。
  // 第一个就是默认播的（极速组里画质最高的优先），后两个在播不了时自动接棒，也是换源菜单的候选。
  const map = new Map();
  st.got.forEach(v => {
    const k = normKw(v.name);
    let cur = map.get(k);
    if (!cur) { cur = { name: v.name, cands: [] }; map.set(k, cur); }
    if (!cur.cands.some(c => String(c.site.key) === String(v.site.key))) cur.cands.push(v);
  });
  const arr = Array.from(map.values());
  arr.forEach(t => {
    t.cands.sort(cmpCand);
    t.cands = t.cands.slice(0, 3);
    const nn = normKw(t.name);
    t.exact = nn === st.q ? 2 : (nn.indexOf(st.q) === 0 ? 1 : 0);
    t.best = t.cands[0];
  });
  // 一律全部列出，不做隐藏（藏了反而让短剧版之类的怪东西顶上来）。
  // 只分三层排：正片 → 同剧的季/集变体 → 其它相关条目，同层内再按源质量。
  const SAME_SHOW = /^(第[0-9一二三四五六七八九十]+季|[0-9]+季|全[0-9]+集|更新至.*|完结篇?|高清版?|国语版?|中字版?|完整版?)$/;
  arr.forEach(t => {
    const nm = normKw(t.name);
    if (t.exact === 2) { t.tier = 3; t.kind = 0; }
    else if (t.exact === 1 && SAME_SHOW.test(nm.slice(st.q.length).replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g, ''))) { t.tier = 2; t.kind = 1; }
    else { t.tier = t.exact; t.kind = t.exact ? 1 : 0; }
  });
  arr.sort((a, b) => (b.tier - a.tier) || cmpCand(a.best, b.best));
  const seenExact = arr.some(t => t.tier === 3);
  arr.forEach(t => { t.side = seenExact && t.tier < 3; });
  const shown = arr;
  const sideN = arr.filter(t => t.tier < 3).length;

  const prog = $('#searchProg');
  if (prog) {
    const left = st.total - st.done;
    const extra = sideN > 0 ? ` · 另有 ${sideN} 个相关条目` : '';
    prog.innerHTML = left > 0
      ? `已搜 ${st.done}/${st.total} · ${shown.length} 部<span>快的源先出结果，极速4K排最前${extra}</span>`
      : `${shown.length} 部 · ${st.hit} 个源有货<span>正片排最前，其余为相关条目${extra}</span>`;
  }

  const grid = $('#searchGrid');
  if (!grid) return;
  if (!shown.length) {
    if (st.done >= st.total) {
      grid.outerHTML = '<div class="empty-sm">没搜到<br><span style="color:var(--dim)">有的源不支持关键词搜索，或者它挂了</span></div>';
    }
    return;
  }
  // 增量渲染：按片名 key 复用卡片节点，排序变了只挪位置，封面图不重新加载。
  // 之前整格 innerHTML 重建，图片全部重载，看起来就是"闪几下才出来"。
  searchResults = shown;
  const existing = {};
  Array.from(grid.children).forEach(el => { if (el.dataset && el.dataset.skey) existing[el.dataset.skey] = el; });
  const used = {};
  const frag = document.createDocumentFragment();
  shown.forEach((t, i) => {
    const k = normKw(t.name);
    used[k] = 1;
    let el = existing[k];
    if (el) {
      // 最优源可能变了：角标/封面要跟着换，但已加载的封面图直接搬过去，不重新闪一次
      const tmp = document.createElement('div');
      tmp.innerHTML = searchCardHTML(t, i);
      const nel = tmp.firstElementChild;
      const oldImg = el.querySelector('img'), newImg = nel.querySelector('img');
      if (oldImg && newImg && oldImg.getAttribute('src') === newImg.getAttribute('src')) newImg.replaceWith(oldImg);
      el.replaceWith(nel);   // 旧节点立刻让位，防止同一张卡留两份
      el = nel;
    } else {
      const tmp = document.createElement('div');
      tmp.innerHTML = searchCardHTML(t, i);
      el = tmp.firstElementChild;
    }
    el.dataset.skey = k;
    el.dataset.idx = String(i);
    frag.appendChild(el);
  });
  Array.prototype.slice.call(grid.children).forEach(el => {
    if (!el.dataset || !used[el.dataset.skey]) el.remove();
  });
  grid.appendChild(frag);
  // 缓存候选给播放器的「换源」用（正片和旁支都存，换源时按片名精确匹配才用得到）
  arr.forEach(t => {
    titleCands.set(normKw(t.name), t.cands.slice());
    t.cands.forEach(c => idxAdd(t.name, c.site, c.id, c.pic));   // 顺手喂索引
  });
  $$('#searchGrid .pcard').forEach(c => c.onclick = () => {
    const t = searchResults[Number(c.dataset.idx)];
    if (t && t.cands.length) {
      $('#maskSearch').classList.remove('on');
      $('#searchInput').value = '';
      const falls = t.cands.slice(1).map(x => ({ id: x.id, pic: x.pic, site: x.site }));
      openDetail(t.cands[0].id, t.cands[0].pic, t.cands[0].site, falls);
    }
  });
}

/* ---------- 详情 ---------- */
async function openDetail(vid, pic, siteOverride, falls, auto, xskip) {
  let site = siteOverride || curSite();
  if (!site) return;
  // 这部片的最优源之前已经实测确认过（12 小时内）：直接开到那个源上，
  // 不再"先开这个源、比价几秒后跳过去"——一次到位，省 3~6 秒，而且绝不跳变。
  let presetBs = null;
  if (!auto && !xskip && falls === undefined) {
    const hint = titleHintFor(vid, site);
    const bs = hint ? bestGet(hint) : null;
    // 记录本身要是"中速以上或 720P 以上"才值得直接跳过去；
    // 记录是慢速/低清说明当时也没找到更好的，那就重新比一次，别被旧结论挡住。
    const bsGood = bs && ((bs.speed || 0) >= 0.45 || /(720|1080|2160|4k)/i.test(String(bs.res || '')));
    if (bsGood && bs.i && bs.k) {
      const curM = hitGet(site.api, vid);
      const kOf = m => { if (!m) return [-1, -1]; const s = speedTier(m); return [s ? s.k : -1, qualKey(m)]; };
      const kb = kOf(bs), kc = kOf(curM);
      const bsNotWorse = !curM || kb[0] > kc[0] || (kb[0] === kc[0] && kb[1] >= kc[1]);
      // 候选里已经有实测更好的（搜索/列表量过的）：直接开那个。
      // 否则旧记录会把档位拉低——卡片写 720P、点进去只有 480P 就是这么来的。
      let pick = null, pk = null;
      ((hint ? titleCands.get(normKw(hint)) : null) || []).slice(0, 3).forEach(c => {
        const m = hitGet(c.site.api, c.id);
        if (!m) return;
        const k = kOf(m);
        if (!(k[0] > kb[0] || (k[0] === kb[0] && k[1] > kb[1]))) return;
        if (!pk || k[0] > pk[0] || (k[0] === pk[0] && k[1] > pk[1])) { pick = c; pk = k; }
      });
      if (pick) {
        const ns = siteByKey(pick.site.key);
        if (ns && !(String(pick.site.key) === String(site.key) && String(pick.id) === String(vid))) {
          site = ns; vid = pick.id; presetBs = null;   // 直接开到更好的那个候选上
        }
      } else if (String(bs.k) === String(site.key) && String(bs.i) === String(vid)) {
        presetBs = bs;              // 当前源就是记录里的最优源：不用比价，线路测完就放行
      } else if (bsNotWorse) {
        const ns = siteByKey(bs.k);
        if (ns) { site = ns; vid = bs.i; presetBs = bs; }   // 直接换到已知最优源
      }
    }
  }
  detailSite = site;
  curDetail = null;
  $('#detailTitle').textContent = '详情';
  $('#detailBody').innerHTML = '<div class="empty-sm">正在拉取详情…</div>';
  $('#maskDetail').classList.add('on');
  // 预热同名片候选搜索：详情成功要比价、失败要抢救，两头都用得上，跟详情拉取并行不挡路
  if (!auto && falls === undefined && !xskip && !presetBs) {
    const hint = titleHintFor(vid, site);
    if (hint) collectCrossSource(hint).catch(() => {});
  }
  try {
    // 预取命中就秒出，不用再等一次接口（点卡片 2~3 秒的等待主要是这里）
    let v = dtlGet(site.api, vid);
    if (!v) {
      const j = await getJSON(apiUrl(site.api, 'ac=videolist&ids=' + encodeURIComponent(vid)), 18000);
      v = (j.list || [])[0];
      if (v) dtlPut(site.api, vid, v);
    }
    if (!v) throw new Error('源站没有返回这条记录');
    curDetail = buildDetail(v, site, pic);
    const d = curDetail;
    if (presetBs) d.__preset = presetBs;   // 记录里的"最优源"，autoBestSource 走秒放行分支
    // 交互门：最优源/最优线路没确定前，播放和选集锁住——
    // 免得"先开一个、过几秒又跳到更快的"。确定好才一次性放开。
    d.__srcPick = (!auto && falls === undefined && !xskip);   // 还有全源比价要跑
    d.__bestReady = !!auto;                                    // 历史续播不锁，直接播
    d.__gateDL = Date.now() + 6000;   // 比价硬期限：6 秒内必须放行——预热没赶上也不让用户干等，
                                      // 超时先用当前源（绝不中途跳源），比价结论落库供下次秒开
    if (!auto) {
      clearTimeout(d.__gateT);
      d.__gateT = setTimeout(() => {   // 保底：万一测速卡死，12 秒后强制放行
        if (curDetail === d && d.__bestReady === false) {
          d.__bestReady = true; d.__srcPick = false; renderDetail();
        }
      }, 12000);
    }
    // 最快的源有时只给网页链接（要解析），这时自动退到下一个源，别让用户手动找
    if (!curDetail.lines.some(l => l.direct > 0) && falls && falls.length) {
      const nxt = falls.shift();
      console.log('[detail] ' + curDetail.name + ' 在 ' + site.name + ' 只有网页链接，换 ' + nxt.site.name);
      return openDetail(nxt.id, nxt.pic, nxt.site, falls, auto, xskip);
    }
    // 这个源压根没给可播地址：栏目点开的直接全源抢救，别把"点开就死"露给用户
    if (!curDetail.lines.length && falls === undefined && !auto && !xskip) {
      if (await rescueDetail(vid, pic, site, curDetail.name)) return;
    }
    renderDetail();
    // 线路全是现成的实测值（probeLines 不会再跑）且没有比价在途：直接放行
    if (d.__bestReady === false && !d.__srcPick &&
        !d.lines.some(l => l.direct > 0 && l.eps.length && !l.m)) {
      d.__bestReady = true;
      renderDetail();
    }
    // 历史续播：详情一出来自动播上次那集并 seek 到上次的位置
    if (auto && curDetail) {
      const line = curDetail.lines[curDetail.li];
      const ei = Math.min(auto.epIdx || 0, line ? line.eps.length - 1 : 0);
      const ep = line && line.eps[ei];
      if (ep) playEp(ep, ei, auto.startAt || 0);
    } else if (!xskip && falls === undefined && curDetail) {
      // 从栏目/收藏随手点开的：这个源不一定是最好的。
      // 后台把其它源的同名片各实测一遍，真有更清晰更快的就自动切过去。
      autoBestSource(curDetail);
    }
  } catch (e) {
    site.__badDet = (site.__badDet || 0) + 1;   // 记一笔：这个源的详情接口出过故障
    // 抢救1：搜索进来的还排着后备候选，直接换下一个源
    if (falls && falls.length) {
      const nxt = falls.shift();
      return openDetail(nxt.id, nxt.pic, nxt.site, falls, auto, xskip);
    }
    // 抢救2：栏目/收藏点开的，拿片名去全源找同名片顶上——卡片好好的就不能点开即死
    const ok = (!auto && !xskip) ? await rescueDetail(vid, pic, site, titleHintFor(vid, site)) : false;
    if (!ok) {
      $('#detailBody').innerHTML = `<div class="empty-sm">拉取失败：${esc(e.message)}<br><br>有的源要爬虫引擎才能出详情，这类只能在原生壳上跑。</div>`;
    }
  }
}

/* 详情拉取失败的"片名"从哪来：栏目列表和搜索结果里按 源+id 找 */
function titleHintFor(vid, site) {
  const sk = site ? String(site.key) : '';
  const pool = (typeof disc !== 'undefined' && disc && disc.list) || [];
  for (const v of pool) {
    if (String(v.id) === String(vid) && (!sk || String(v.siteKey || '') === sk)) return v.name;
  }
  const sr = (typeof searchResults !== 'undefined' && searchResults) || [];
  for (const t of sr) {
    for (const c of (t.cands || [])) {
      if (String(c.id) === String(vid) && (!sk || String(c.site.key) === sk)) return t.name;
    }
  }
  return '';
}
/* 全源抢救：同名片逐个试，第一个能出详情的源直接顶上，并照常做最优源比价 */
async function rescueDetail(vid, pic, site, name) {
  if (!name) return false;
  let cands = [];
  try { cands = await collectCrossSource(name) || []; } catch (e) {}
  cands = cands.filter(c => !site || String(c.site.key) !== String(site.key));
  for (const c of cands) {
    try {
      let v = dtlGet(c.site.api, c.id);
      if (!v) {
        const j = await getJSON(apiUrl(c.site.api, 'ac=videolist&ids=' + encodeURIComponent(c.id)), 12000);
        v = (j.list || [])[0];
        if (v) dtlPut(c.site.api, c.id, v);
      }
      if (!v) continue;
      const dv = buildDetail(v, c.site, pic);
      if (!dv.lines.length) continue;
      detailSite = c.site;
      curDetail = dv;
      $('#detailTitle').textContent = dv.name;
      // 抢救来的源同样要过"最优确定"这道门：没比完不许播，杜绝先开后跳
      dv.__srcPick = true; dv.__bestReady = false;
      clearTimeout(dv.__gateT);
      dv.__gateT = setTimeout(() => {
        if (curDetail === dv && dv.__bestReady === false) { dv.__bestReady = true; dv.__srcPick = false; renderDetail(); }
      }, 45000);
      renderDetail();
      autoBestSource(dv);   // 抢救来的源也要比价（候选已在缓存里，秒回）
      return true;
    } catch (e) {}
  }
  return false;
}

/* 栏目点开后的"自动找最优源"：
   搜索结果进来时已经是排好序的最优源，不用再比；
   栏目卡片是各源自己分类里的，得比过才知道是不是最好的。
   规则：只实测排名前 2 的候选 + 当前源（复用 probeLines 正在量的同一条流，不抢带宽），
   实测档位严格更高才切。一切竞速：门要在 10 秒上下放开，不能让用户干等。 */
let xsrcSeq = 0;
function gateRelease(d) {
  if (!d) return;
  d.__srcPick = false;
  if (d.__bestReady !== false) return;
  d.__bestReady = true;
  if (curDetail === d && !(playCtx && playCtx.d)) { try { renderDetail(); } catch (e) {} }
}
// 等 probeLines 把当前源这条流的实测落库（它量完会 hitPut），别自己再量一遍抢带宽
function waitHit(api, id, ms) {
  return new Promise(res => {
    const t0 = Date.now();
    const tick = () => {
      const m = hitGet(api, id);
      if (m) return res(m);
      if (Date.now() - t0 > ms) return res(null);
      setTimeout(tick, 400);
    };
    tick();
  });
}
async function autoBestSource(d) {
  const seq = ++xsrcSeq;
  const pastDL = () => !!(d.__gateDL && Date.now() > d.__gateDL);   // 6 秒硬期限到了吗
  try {
    // 当前源这部片已是实测的"极速+高清"顶配，没源能严格超过——秒放行（30 分钟内二次打开零等待）
    const pre = hitGet(d.api, d.id);
    if (pre) {
      const s0 = speedTier(pre), q0 = qualTier(pre);
      if (s0 && s0.k >= 2 && q0 && q0.k >= 2) { bestPut(d.name, detailSite, d.id, pre); gateRelease(d); return; }
    }
    // 记录里已确认"当前源就是最优"：跳过全源比价，线路实测一出来就放行（通常 1 秒内）。
    // 但如果记录本身就是慢速/低清（当时没找到更好的），别拿它挡住新的比价——再找一次。
    const bs = d.__preset;
    const bsGood = bs && ((bs.speed || 0) >= 0.45 || /(720|1080|2160|4k)/i.test(String(bs.res || '')));
    if (bs && bsGood && detailSite && String(bs.k) === String(detailSite.key)) {
      const m = hitGet(d.api, d.id) || await waitHit(d.api, d.id, 7000);
      if (seq !== xsrcSeq || curDetail !== d) return;
      if (m && ((m.speed || 0) > 0 || (m.mbps || 0) > 0)) { bestPut(d.name, detailSite, d.id, m); gateRelease(d); return; }
      // 实测是死流/量不出来：索引或线路变了，退回完整比价
    }
    const candsP = collectCrossSource(d.name);
    candsP.catch(() => {});
    const ck = m => { if (!m) return [-1, -1]; const s = speedTier(m); return [s ? s.k : -1, qualKey(m)]; };
    // 当前源的实测（probeLines 正在量同一条流，通常 1~2 秒）——和候选搜索并行跑，别串行相加
    const curP = hitGet(d.api, d.id) || waitHit(d.api, d.id, 4500);
    const cands0 = await candsP;
    if (seq !== xsrcSeq || curDetail !== d) return;
    const cands = (cands0 || [])
      .filter(c => !detailSite || String(c.site.key) !== String(detailSite.key))
      .slice(0, 3);   // 候选最多筛 3 个（一轮并行跑完）：先快筛排序，再单独确认最有可能的那个
    // 候选的"详情 + 地址解析"只是小请求，先并行备好（几百毫秒）；
    // 真正的下载测速一条一条排队来——同时下载会互相抢带宽、把速度测低，比价就不准了。
    const prep = cands.map(c => prepCand(c));
    const curEarly = await curP;
    if (seq !== xsrcSeq || curDetail !== d) return;
    // 期限到了：立刻用当前源放行，比价结论（哪怕不完备）落库供下次秒开
    if (pastDL()) { bestPut(d.name, detailSite, d.id, curEarly || hitGet(d.api, d.id)); gateRelease(d); return; }
    if (curEarly) {
      const s0 = speedTier(curEarly), q0 = qualTier(curEarly);
      if (s0 && s0.k >= 2 && q0 && q0.k >= 2) { bestPut(d.name, detailSite, d.id, curEarly); gateRelease(d); return; }
    }
    if (playCtx && playCtx.d) { gateRelease(d); return; }
    if (!cands.length) { bestPut(d.name, detailSite, d.id, curEarly); gateRelease(d); return; }
    // 上限预判：候选按"源级历史最好档位"都超不过当前实测 → 没人能赢，立刻放行
    if (curEarly) {
      const curK0 = ck(curEarly);
      const capped = cands.every(c => {
        const m = hitGet(c.site.api, c.id) || METRICS[c.site.api];
        const known = m && (m.speed > 0 || m.mbps > 0);
        const k = known ? ck(m) : [2, 3];
        return !(k[0] > curK0[0] || (k[0] === curK0[0] && k[1] > curK0[1]));
      });
      if (capped) { bestPut(d.name, detailSite, d.id, curEarly); gateRelease(d); return; }
    }
    // 串行实测候选：谁先测出"严格更优"就停，直接切过去
    let curM = curEarly || hitGet(d.api, d.id);
    if (!curM) {
      try {
        const l0 = d.lines.find(l => l.direct > 0 && l.eps.length) || d.lines.find(l => l.eps.length);
        const u = l0 ? await resolvePlayUrl(l0.eps[0].url) : '';
        if (/\.m3u8/i.test(u)) {
          const m = await measureStream(u);
          if (m && (m.mbps || m.speed || m.res)) {
            keepRes(m, d.api, d.id);
            curM = { u, res: m.res || '', mbps: m.mbps || 0, speed: m.speed || 0, ttfb: m.ttfb || 0 };
            hitPut(d.api, d.id, curM);
          }
        }
      } catch (e) {}
    }
    if (!curM) curM = METRICS[d.api] || null;
    const curK = ck(curM);
    // 候选按"这部片自己的实测"排前面（源级历史只是兜底），再逐个单独确认：
    // 一条流一条流地测，不互相抢带宽，数字才准；最多确认 3 个，够了就停。
    const preps = await Promise.all(prep);
    if (seq !== xsrcSeq || curDetail !== d) return;
    const ready = preps.filter(Boolean);
    let bestM = null, bestC = null, bestK = curK;
    for (let k = 0; k < ready.length && k < 3; k++) {
      if (seq !== xsrcSeq || curDetail !== d) return;
      // 期限到：已确认的更优源照常切（还没开播，切换只是重渲染详情，不产生跳变）；
      // 还没确认出赢家就停手，用当前源放行。
      if (pastDL()) break;
      if (document.hidden) { gateRelease(d); return; }   // 切后台了，别继续花流量测速
      if (playCtx && playCtx.d) { gateRelease(d); return; }
      const rc = ready[k];
      let m = null;
      try { m = await measureStream(rc.u, { budget: 800, cap: 320 * 1024 }); } catch (e) {}
      if (!m || !(m.mbps || m.speed || m.res)) continue;
      keepRes(m, rc.c.site.api, rc.c.id);   // 换 CDN 地址时沿用该片已量到的真分辨率，别估低一档
      const rec = { u: rc.u, res: m.res || '', mbps: m.mbps || 0, speed: m.speed || 0, ttfb: m.ttfb || 0 };
      hitPut(rc.c.site.api, rc.c.id, rec);
      const kk = ck(rec);
      if (kk[0] > bestK[0] || (kk[0] === bestK[0] && kk[1] > bestK[1])) { bestM = rec; bestC = rc.c; bestK = kk; }
      // 已经测到"极速 + 高清"，不可能再好，别再多花时间
      if (bestK[0] >= 2 && bestK[1] >= 2) break;
    }
    if (seq !== xsrcSeq || curDetail !== d) return;
    if (!bestM) { bestPut(d.name, detailSite, d.id, curM); gateRelease(d); return; }   // 当前源就是实测最优
    const bc = bestC;
    const falls = cands.filter(c => !(String(c.site.key) === String(bc.site.key) && String(c.id) === String(bc.id)))
      .map(x => ({ id: x.id, pic: x.pic, site: x.site }));
    const tag = tierTag(bestM) || '';
    bestPut(d.name, bc.site, bc.id, bestM);   // 记住：这部片的最优源就是这个
    toast('画质速度更优，已切到 ' + String(bc.site.name || '').replace(/[┃|]/g, '').trim() + (tag ? ' · ' + tag.replace(/<[^>]+>/g, '') : ''));
    d.__srcPick = false;
    openDetail(bc.id, bc.pic, bc.site, falls, null, true);

}
/* 候选源的首集地址：拿详情（缓存优先）→ 取默认线路第一集 → 解析成真 m3u8 */
async function prepCand(c) {
  try {
    let v = dtlGet(c.site.api, c.id);
    if (!v) {
      const j = await getJSON(apiUrl(c.site.api, 'ac=videolist&ids=' + encodeURIComponent(c.id)), 7000);
      v = (j.list || [])[0];
      if (v) dtlPut(c.site.api, c.id, v);
    }
    if (!v) return null;
    const dv = buildDetail(v, c.site);
    const l0 = dv.lines.find(l => l.direct > 0 && l.eps.length) || dv.lines.find(l => l.eps.length);
    const u = l0 ? await resolvePlayUrl(l0.eps[0].url) : '';
    return /\.m3u8/i.test(u) ? { c, dv, u } : null;
  } catch (e) { return null; }
}

function isDirectUrl(u) {
  const s = String(u || '');
  return /\.(m3u8|mp4|flv|mkv|ts)(\?|#|$)/i.test(s) || /^(rtmp|rtsp):\/\//i.test(s);
}
/* 有些源（电影天堂/量子这类"直连"）实际给的是 /share/<hash> 的播放页，
   页面的 <script> 里写着 const url = "/20250217/xxx/index.m3u8?sign=..."。
   拉一次 1KB 的页面就能拿到真地址，解一次缓存住，后面不再多花一个 RTT。 */
const SHARE_MAP = Object.create(null);
function isSharePage(u) { return /\/share\/[^/?#]+/i.test(String(u || '')); }
async function resolvePlayUrl(u) {
  const s = String(u || '');
  if (isDirectUrl(s)) return s;
  if (SHARE_MAP[s]) return SHARE_MAP[s];
  if (!/^https?:/i.test(s)) return s;
  let html = '';
  try { html = await fetchTextT(s, 6500); } catch (e) { return s; }
  const m = /(?:const|let|var)\s+url\s*=\s*["']([^"']+)["']/i.exec(html)
    || /["']url["']\s*:\s*["']([^"']+)["']/i.exec(html)
    || /(https?:\/\/[^"'\s\\]+\.m3u8[^"'\s\\]*)/i.exec(html)
    || /(\/[^"'\s\\]+\.m3u8[^"'\s\\]*)/i.exec(html);
  if (!m) return s;
  const abs = absUrl(s, String(m[1]).replace(/\\\//g, '/'));
  if (!isDirectUrl(abs)) return s;
  SHARE_MAP[s] = abs;
  return abs;
}

function buildDetail(v, site, pic) {
  const froms = String(v.vod_play_from || '').split('$$$');
  const blobs = String(v.vod_play_url || '').split('$$$');
  const lines = [];
  blobs.forEach((blob, i) => {
    const eps = [];
    String(blob).split('#').forEach(s => {
      const idx = s.indexOf('$');
      if (idx <= 0) return;
      const n = s.slice(0, idx).trim();
      const u = s.slice(idx + 1).trim();
      if (!/^(https?|rtmp|rtsp):\/\//i.test(u)) return;
      eps.push({ name: n || ('第' + (eps.length + 1) + '集'), url: u });
    });
    if (eps.length) {
      // 分享页也算"能播"：点开时会解出真 m3u8
      const direct = eps.filter(e => isDirectUrl(e.url) || isSharePage(e.url)).length;
      lines.push({ name: (froms[i] || ('线路' + (i + 1))).trim(), eps, direct });
    }
  });
  // 直链线路排前面：能直接播的永远比需要解析的靠前
  lines.sort((a, b) => (b.direct > 0 ? 1 : 0) - (a.direct > 0 ? 1 : 0) || b.direct - a.direct);
  const tags = [v.vod_year, v.vod_area, v.vod_remarks, v.type_name, v.vod_class]
    .filter(Boolean).map(String).filter((x, i, a) => a.indexOf(x) === i).slice(0, 4);
  const desc = String(v.vod_content || v.vod_blurb || '')
    .replace(/<[^>]+>/g, ' ').replace(/&nbsp;/g, ' ').replace(/\s+/g, ' ').trim();
  return {
    id: String(v.vod_id),
    name: String(v.vod_name || '未知'),
    pic: v.vod_pic || pic || '',
    rem: v.vod_remarks || '',
    tags, desc, lines, li: 0,
    siteName: site.name, api: site.api
  };
}

/* 线路按钮：上面线路名，下面「直连 + 清晰度·速度」——测出来的才显示，测完即时刷新 */
function lineChipHTML(l, i, on) {
  const tag = l.m ? tierTag(l.m) : (l.mp === 1 ? '<i class="qtag q-ld">测速中…</i>' : '');
  const sub = (l.direct ? '<em class="lm">直连</em>' : '<em class="lm">网页</em>') + tag;
  return `<button class="chip ${on ? 'on' : ''}" data-li="${i}"><b class="lnm">${esc(l.name)}</b><span class="lsub">${sub}</span></button>`;
}
function paintLineBar() {
  const d = curDetail;
  const bar = $('#lineBar');
  if (!d || !bar || d.lines.length < 1) return;
  bar.innerHTML = d.lines.map((l, i) => lineChipHTML(l, i, i === d.li)).join('');
  $$('#lineBar .chip').forEach(b => b.onclick = () => {
    d.li = Number(b.dataset.li);
    d.__liUser = 1;
    renderDetail();
  });
}
// 每条直连线路拿第一集量一次：出真实分辨率 + 码率 + 下载速度
async function probeLines(d) {
  const seq = ++lineProbeSeq;
  const jobs = d.lines.filter(l => l.direct > 0 && l.eps.length && !l.m).slice(0, 2);
  let k = 0;
  const worker = async () => {
    while (k < jobs.length) {
      const l = jobs[k++];
      if (seq !== lineProbeSeq || curDetail !== d) return;
      l.mp = 1; paintLineBar();
      try {
        const u = await resolvePlayUrl(l.eps[0].url);
        // 搜索时量过同一条地址：直接用那份结果，保证搜索结果和详情页数字一模一样
        const h = d.api ? hitGet(d.api, d.id) : null;
        if (h && h.u && h.u === u) {
          l.m = { res: h.res, mbps: h.mbps, speed: h.speed, ttfb: h.ttfb };
          l.mp = 2;
          if (seq === lineProbeSeq && curDetail === d) paintLineBar();
          continue;
        }
        const m = await measureStream(u);
        if (m && (m.res || m.mbps)) {
          keepRes(m, d.api, d.id);
          l.m = m;
          // 每部片只记"默认线路"这一份实测：后面线路若覆盖，会把坏线路的 0 速度盖到
          // 默认线路上，导致比价时误判"当前源不行"，白白多等十几秒
          if (!hitGet(d.api, d.id)) hitPut(d.api, d.id, { u, res: m.res || '', mbps: m.mbps || 0, speed: m.speed || 0, ttfb: m.ttfb || 0 });
        }
      } catch (e) {}
      l.mp = 2;
      if (seq === lineProbeSeq && curDetail === d) paintLineBar();
    }
  };
  await Promise.all([worker(), worker()]);
  // 都量完了：把实测最优的线路排到第一位并选中——默认播的就是最清晰最快的那条。
  // 用户手动选过线路、或已经开播的（历史续播），就不动，尊重当前状态。
  if (seq === lineProbeSeq && curDetail === d) {
    let changed = false;
    if (!d.__liUser && !(playCtx && playCtx.d)) {
      const lk = l => {
        if (!l.m) return [-1, l.direct > 0 ? 1 : 0];
        const s = speedTier(l.m);
        return [s ? s.k : -1, qualKey(l.m), l.direct > 0 ? 1 : 0];
      };
      const selBefore = d.lines[d.li];
      d.lines.sort((a, b) => { const ka = lk(a), kb = lk(b); for (let i = 0; i < ka.length; i++) { if (kb[i] !== ka[i]) return kb[i] - ka[i]; } return 0; });
      d.li = 0;   // 排完最优在第 0 位，默认选中它
      changed = d.lines[0] !== selBefore;
    }
    // 线路定下来了：没有全源比价在途的话，此刻就是"确定好了"，放开播放
    if (!d.__srcPick && d.__bestReady === false) { d.__bestReady = true; changed = true; }
    if (changed) renderDetail();
    else paintLineBar();
  }
}

function renderDetail() {
  const d = curDetail;
  if (!d) return;
  $('#detailTitle').textContent = d.name;
  const tags = d.tags.map(t => `<span class="dtag">${esc(t)}</span>`).join('');
  const lineBar = d.lines.length >= 1
    ? `<div class="linebar" id="lineBar">${d.lines.map((l, i) => lineChipHTML(l, i, i === d.li)).join('')}</div>`
    : '';
  const cur = d.lines[d.li];
  const gating = d.__bestReady === false;   // 最优源/线路没定下来前，播放先锁住
  const eps = cur ? cur.eps.map((e, i) =>
    `<button class="epbtn" data-ei="${i}">${esc(e.name)}</button>`).join('') : '';

  $('#detailBody').innerHTML = `
    <div class="dhead">
      <div class="dposter">${d.pic ? `<img src="${esc(d.pic)}" referrerpolicy="no-referrer" onerror="this.remove()">` : ''}</div>
      <div class="dinfo">
        <h3>${esc(d.name)}</h3>
        <div class="dmeta">${esc(d.siteName)}${d.rem ? ' · ' + esc(d.rem) : ''}</div>
        <div class="dtags">${tags}</div>
      </div>
    </div>
    ${gating ? '<div style="font-size:12px;color:var(--dim);padding:2px 0 6px">⚡ 正在全源实测，为你锁定最清晰最快的源…</div>' : ''}
    ${d.desc ? `<p class="ddesc" id="dDesc">${esc(d.desc)}</p><span class="dmore" id="dMore">展开全部</span>` : ''}
    ${lineBar}
    ${cur ? `<div class="eps" id="epGrid">${eps}</div>` : `<div class="empty-sm">这个源没有可播地址</div>`}
    <div class="formfoot"><button class="btnpill solid" id="dPlayFirst"${gating ? ' style="opacity:.55"' : ''}>${gating ? '正在挑选最优源…' : '播放第一集'}</button></div>
  `;

  const more = $('#dMore');
  if (more) more.onclick = () => {
    const p = $('#dDesc');
    p.classList.toggle('on');
    more.textContent = p.classList.contains('on') ? '收起' : '展开全部';
  };

  $$('#lineBar .chip').forEach(b => b.onclick = () => {
    d.li = Number(b.dataset.li);
    d.__liUser = 1;
    renderDetail();
  });
  $$('#epGrid .epbtn').forEach(b => b.onclick = () => {
    if (d.__bestReady === false) { toast('正在挑选最优源，确定好马上放开'); return; }
    playEp(d.lines[d.li].eps[Number(b.dataset.ei)]);
  });
  const pf = $('#dPlayFirst');
  if (pf) pf.onclick = () => {
    if (d.__bestReady === false) { toast('正在挑选最优源，确定好马上放开'); return; }
    if (cur && cur.eps[0]) playEp(cur.eps[0]);
  };

  // 线路档位标签：没量过的补量，量完只刷新线路栏，不打断选集
  if (d.lines.some(l => l.direct > 0 && l.eps.length && !l.m)) probeLines(d);
}

async function playEp(ep, idx, startAt) {
  const d = curDetail;
  if (!d || !ep) return;
  const site = detailSite || curSite();
  // 分享页（/share/xxx）里藏着真 m3u8，先解一层再判断能不能播
  let url = ep.url;
  if (!isDirectUrl(url)) {
    url = await resolvePlayUrl(url);
    if (!isDirectUrl(url)) {
      const alt = d.lines.find(l => l.direct > 0 && l.eps.length && l.eps[0] !== ep);
      if (alt) {
        toast('这条线路解不出来，已切到「' + alt.name + '」');
        playEp(alt.eps[0], 0, startAt);
        return;
      }
      toast('这部片只有网页链接，前端播不了');
      return;
    }
  }
  const useEp = url === ep.url ? ep : Object.assign({}, ep, { url });
  // 记录剧集上下文，供播放器内「上一集/下一集/选集」使用
  let li = d.lines.findIndex(l => l.eps.indexOf(ep) >= 0);
  if (li < 0) li = d.li || 0;
  const ei = idx != null ? idx : Math.max(0, d.lines[li].eps.indexOf(ep));
  playCtx = { d, li, ei };
  const it = ensureItem(d, useEp, site);
  recordHistory({
    name: d.name, epName: ep.name, pic: d.pic, url: useEp.url, itemId: it.id,
    vid: d.id, api: site ? site.api : '', siteKey: site ? site.key : '',
    siteName: site ? site.name : '', epIdx: ei
  });
  $('#maskDetail').classList.remove('on');
  openPlayer(it.id, startAt);
}

function ensureItem(d, ep, site) {
  let it = state.items.find(x => x.url === ep.url);
  if (!it) {
    it = {
      id: uid(),
      title: d.name + (ep.name && ep.name !== d.name ? ' · ' + ep.name : ''),
      url: ep.url,
      type: isHls(ep.url) ? 'hls' : 'mp4',
      progress: 0, duration: 0,
      addedAt: Date.now(),
      lastPlayed: 0,
      kind: 'net',
      poster: d.pic,
      source: (site ? site.name : '源站')
    };
    state.items.unshift(it);
    if (state.items.length > 300) state.items.length = 300;
  }
  it.poster = d.pic || it.poster;
  save();
  return it;
}

// 把播放列表里的相对地址拼成绝对地址（/ 开头要给 origin，别直接拼 base）
function absUrl(base, u) {
  const x = String(u || '').trim();
  if (/^https?:/i.test(x)) return x;
  if (x[0] === '/') {
    const m = /^(https?:\/\/[^/]+)/i.exec(base);
    return (m ? m[1] : '') + x;
  }
  return base + x.replace(/^\.\//, '');
}

async function fetchTextT(url, ms) {
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), ms || 9000);
  try {
    const r = await fetch(relay(url), { signal: c.signal, headers: { 'Accept': '*/*' } });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.text();
  } finally { clearTimeout(t); }
}

/* 同一个地址的"档位"必须稳定：码率是抽样估出来的，两次测量在 720P/480P 边界上来回跳，
   就成了"搜索卡片写 720P、点进去变 480P"。这里按地址记住第一次定下的分辨率/码率，
   之后重测只更新速度，档位不再变。 */
const URLC = Object.create(null);
const URL_TTL = 60 * 60000;
function urlcGet(u) {
  const e = URLC[u];
  if (!e) return null;
  if (Date.now() - e.at > URL_TTL) { delete URLC[u]; return null; }
  return e;
}
function urlcPut(u, res, mbps) {
  if (!u) return;
  URLC[u] = { res: res || '', mbps: mbps || 0, at: Date.now() };
  const ks = Object.keys(URLC);
  if (ks.length > 400) {
    ks.sort((a, b) => (URLC[a].at || 0) - (URLC[b].at || 0));
    for (let i = 0; i < ks.length - 300; i++) delete URLC[ks[i]];
  }
}

// 量一条流：master 取最高档的分辨率/标称码率；media 用"分片字节 / 时长"算真实码率，
// 顺便真的下一片，得到可用带宽（这个才代表卡不卡）。
async function measureStream(u, opt) {
  if (!/\.m3u8/i.test(u)) {
    u = await resolvePlayUrl(u);
    if (!/\.m3u8/i.test(u)) return null;
  }
  const o = opt || {};
  const base = u.slice(0, u.lastIndexOf('/') + 1);
  const t0 = performance.now();
  let pl;
  try { pl = await fetchTextT(u, 5000); } catch (e) { return null; }
  const ttfb = Math.round(performance.now() - t0);
  let res = '', mbps = 0, durl = u;
  // 定档：优先用真实分辨率；没有真实分辨率时，沿用上一次给这个地址定下的档位，
  // 避免码率抽样抖动让同一路流一会儿 720P、一会儿 480P
  const c0 = urlcGet(u);
  const settle = (r, mb, sp, url) => {
    let rr = String(r || '').trim() ? r : (c0 && c0.res ? c0.res : '');
    let mm = mb || 0;
    if (!String(r || '').trim()) {
      // 没拿到 RESOLUTION：档位只能靠码率推，那就必须稳——用记录里的值，别用这次抽样
      if (c0 && c0.mbps > 0) mm = c0.mbps;
      if (!String(rr || '').trim() && c0 && c0.res) rr = c0.res;
    }
    const rec = { res: rr, mbps: Math.round(mm * 10) / 10, ttfb: ttfb, speed: sp };
    if (url) rec._u = url;
    urlcPut(u, rec.res, rec.mbps);
    if (url) urlcPut(url, rec.res, rec.mbps);
    return rec;
  };

  if (/#EXT-X-STREAM-INF/i.test(pl)) {
    // master：只认"真正要下载的那个变体"自己的 RESOLUTION。
    // 之前是循环里随便取一个 RESOLUTION，可能取到低档变体的，却用最高档变体测速 → 标签错乱。
    const lines = pl.split('\n').map(x => x.trim());
    let best = null;
    for (let i = 0; i < lines.length; i++) {
      if (!/^#EXT-X-STREAM-INF/i.test(lines[i])) continue;
      const attr = lines[i];
      const bw = Number((/BANDWIDTH=(\d+)/i.exec(attr) || [])[1] || 0);
      let rr = /RESOLUTION=(\d+)x(\d+)/i.exec(attr);
      let j = i + 1;
      if (!rr && j < lines.length && /RESOLUTION=/i.test(lines[j])) rr = /RESOLUTION=(\d+)x(\d+)/i.exec(lines[j]);
      while (j < lines.length && (!lines[j] || lines[j][0] === '#' || /^RESOLUTION=/i.test(lines[j]))) j++;
      const uri = lines[j] || '';
      if (!uri || /^#/.test(uri)) continue;
      const cand = { bw, uri, res: rr ? rr[2] + 'P' : '' };
      if (!best || cand.bw > best.bw) best = cand;
    }
    if (!best) return { res: (c0 && c0.res) || '', mbps: (c0 && c0.mbps) || 0, ttfb: ttfb, speed: 0 };
    res = best.res;                 // 只取最高码率变体自己的分辨率
    mbps = best.bw / 1e6;
    durl = absUrl(base, best.uri);
    try { pl = await fetchTextT(durl, 6000); } catch (e) { pl = ''; }
  }

  if (pl && /#EXTINF/i.test(pl)) {
    // 分片和它自己的时长配对：不同分片时长不一样，用第一个的时长算码率会差好几倍
    const lines2 = pl.split('\n').map(x => x.trim());
    const segPairs = [];
    let curD = 0;
    for (let i = 0; i < lines2.length; i++) {
      const mm = /^#EXTINF:\s*([0-9.]+)/i.exec(lines2[i]);
      if (mm) { curD = parseFloat(mm[1]) || 0; continue; }
      if (lines2[i] && lines2[i][0] !== '#') {
        if (curD > 0) segPairs.push({ d: curD, u: lines2[i] });
        curD = 0;
      }
    }
    const segs = segPairs.map(x => x.u);
    const ext = segPairs.length ? segPairs[Math.min(segPairs.length - 1, Math.floor(segPairs.length * 0.7))].d : 0;
    if (ext > 0 && segs.length) {
      // 取靠后的一片，避免命中缓存测出假速度
      const pick = segs[Math.min(segs.length - 1, Math.floor(segs.length * 0.7))];
      const su = absUrl(durl.slice(0, durl.lastIndexOf('/') + 1), pick);
      const t1 = performance.now();
      try {
        const r = await fetch(relay(su), { cache: 'no-store' });
        const total = Number(r.headers.get('Content-Length') || 0);
        // 只读前几百 KB 就够算速度了：整片下完（慢源 5-10MB）会把测速拖到十几秒
        const CAP = o.cap || 320 * 1024, BUDGET = o.budget || 1500;
        let got = 0;
        if (r.body && r.body.getReader) {
          const rd = r.body.getReader();
          try {
            while (got < CAP) {
              const { done, value } = await rd.read();
              if (done) break;
              got += value ? value.length : 0;
              if (performance.now() - t1 > BUDGET) break;
            }
          } finally { try { rd.cancel(); } catch (e) {} }
        } else {
          const buf = await r.arrayBuffer();
          got = buf.byteLength;
        }
        const el = (performance.now() - t1) / 1000;
        let speed = el > 0.08 ? (got * 8) / el / 1e6 : 0;
        if (speed > 60) speed = 0;               // 明显是缓存命中，不做数
        speed = Math.round(speed * 10) / 10;
        const size = total || got;
        const est = size > 0 ? (size * 8) / ext / 1e6 : 0;
        // 有真实分辨率时，画质档不受码率影响；没有分辨率时才用码率兜底（只用来定档，不覆盖已定档）
        if (est > 0 && (!mbps || est < mbps * 2)) mbps = est;
        const rec = settle(res, mbps, speed, durl);
        console.log('[measure] ' + (rec.res || '-') + ' ' + rec.mbps + 'Mbps ' +
          rec.speed + 'MB/s ttfb' + ttfb + 'ms get' + Math.round(got / 1024) + 'KB/' + Math.round(el * 1000) + 'ms');
        return rec;
      } catch (e) {
        console.log('[measure] 分片失败 ' + String(su).slice(0, 70) + ' → ' + (e && e.message));
        return settle(res, mbps, 0, durl);
      }
    }
  }
  return (res || mbps || (c0 && (c0.res || c0.mbps))) ? settle(res, mbps, 0, durl) : null;
}

/* ---------- 四档标注：画质 4K/1080P/720P/480P，速度 极速/中速/慢速 ---------- */
// 画质档：有实测分辨率就按分辨率定档；没标注才用码率兜底（≥10M 4K / ≥3.5M 1080P / ≥1.8M 720P / 其余 480P）
function qualTier(m) {
  if (!m) return null;
  const raw = String(m.res || '').toLowerCase();
  const h = parseInt(raw.replace(/[^0-9]/g, ''), 10) || 0;
  const mb = m.mbps || 0;
  if (/4k|2160|uhd/.test(raw) || h >= 1600 || (!h && mb >= 10)) return { k: 3, n: '4K' };
  if (h >= 1000) return { k: 2, n: '1080P' };
  if (h >= 700) return { k: 1, n: '720P' };
  if (h > 0) return { k: 0, n: '480P' };
  if (mb >= 3.5) return { k: 2, n: '1080P' };
  if (mb >= 1.8) return { k: 1, n: '720P' };
  if (mb > 0) return { k: 0, n: '480P' };
  return null;
}
// 画质档位键：分辨率若是"按码率估的"（没有真 RESOLUTION）就降半档。
// 同等标签下真量过分辨率的优先——否则会出现"卡片标 ≈720P、点进去真实只有 480P"。
function qualKey(m) {
  const q = qualTier(m);
  if (!q) return -1;
  return String((m && m.res) || '').trim() ? q.k : q.k - 0.5;
}
// 速度档：看实测下载速度（MB/s）。≥1.2 极速 / ≥0.45 中速 / 其余 慢速
function speedTier(m) {
  if (!m || !(m.speed > 0)) return null;
  if (m.speed >= 1.2) return { k: 2, n: '极速' };
  if (m.speed >= 0.45) return { k: 1, n: '中速' };
  return { k: 0, n: '慢速' };
}
// 一个源的档位标签，如「1080P·极速」；两个都有才合成一档色
function tierTag(m) {
  const q = qualTier(m), s = speedTier(m);
  if (!q && !s) return '';
  // 没有真实分辨率、只按码率推的，标个 ≈ 表示估算，别假装精确
  const approx = q && !String(m.res || '').trim() ? '≈' : '';
  const t = (q ? approx + q.n : '') + (s ? '·' + s.n : '');
  const qcls = { 3: 'q-4k', 2: 'q-hd', 1: 'q-sd', 0: 'q-lo' }[q ? q.k : -1];
  const cls = qcls || (s.k === 2 ? 'q-ok' : (s.k === 1 ? 'q-mid' : 'q-bad'));
  return '<i class="qtag ' + cls + '">' + esc(t) + '</i>';
}
function metricBadges(m) {
  const tag = tierTag(m);
  if (!tag) return '';
  let extra = '';
  if (m && m.mbps) extra += m.mbps + 'M';
  if (m && m.speed) extra += (extra ? '·' : '') + m.speed + 'MB/s';
  return tag + (extra ? '<i class="qtag">' + extra + '</i>' : '');
}

/* ---------- 源评测：覆盖 / 库容 / 直连 / 速度 四维打分 ---------- */
// 一轮：只取分类列表，量延迟。通不了直接淘汰，省流量。
async function quickProbe(s) {
  const t0 = performance.now();
  try {
    const j = await getJSON(apiUrl(s.api, 'ac=list'), 6000);
    const cats = (j.class || j.categories || [])
      .map(c => ({ id: String(c.type_id), name: String(c.type_name) }))
      .filter(c => c.id && c.name);
    return { s, cats, ms: performance.now() - t0 };
  } catch (e) { return { s, cats: [], ms: 9999 }; }
}

// 二轮：均匀抽 4 个分类看有没有片，再拉一条详情确认能拿到直链
async function probeSite(s, catList) {
  const api = String(s.api || '');
  const cats = catList || [];
  if (!cats.length) return { score: 0 };
  // 只看用户真正会点的前 6 个分类：有的源"电影片"里只有 1 条，全在"动作片"里
  const picks = cats.slice(0, 6);
  const t1 = performance.now();
  const rs = await Promise.all(picks.map(c =>
    getJSON(apiUrl(api, 'ac=videolist&t=' + c.id + '&pg=1'), 7000)
      .then(x => ({ n: (x.list || []).length, total: Number(x.total || 0) || 0, tid: c.id, list: x.list || [], ms: performance.now() - t1 }))
      .catch(() => ({ n: 0, total: 0, tid: c.id, list: [], ms: 9999 }))
  ));
  const cover = rs.filter(r => r.n >= 10).length;   // 至少 10 条才算"这个分类有货"
  if (!rs.some(r => r.n > 0)) return { score: 0, cover: 0, reason: '分类下没片' };
  const best = rs.slice().sort((a, b) => b.n - a.n)[0];
  const listMs = Math.min.apply(null, rs.map(r => r.ms));
  // 分类里的 total 只是该分类的条数，真正的库容量要查总表
  let total = 0;
  try {
    const g = await getJSON(apiUrl(api, 'ac=videolist&pg=1'), 7000);
    total = Number(g.total || 0) || 0;
  } catch (e) {}
  if (!total) total = rs.reduce((a, r) => a + r.total, 0);

  // 详情级验真：拿不到 m3u8/mp4 的源，列表再好看也播不了
  let direct = 0, sample = '', playUrl = '';
  const v = best.list[0];
  if (v) {
    sample = String(v.vod_name || '');
    let pu = String(v.vod_play_url || '');
    if (!/\.(m3u8|mp4)/i.test(pu) && !/\/share\//i.test(pu) && v.vod_id) {
      try {
        const d = await getJSON(apiUrl(api, 'ac=videolist&ids=' + v.vod_id), 7000);
        const dv = (d.list || [])[0];
        if (dv) pu = String(dv.vod_play_url || '');
      } catch (e) {}
    }
    direct = /\.(m3u8|mp4)/i.test(pu) || /\/share\//i.test(pu) ? 1 : 0;
    if (direct) {
      // 取最后一条线路（一般是最高清的那条）里的第一条能播地址
      const blobs = pu.split('$$$');
      for (let k = blobs.length - 1; k >= 0 && !playUrl; k--) {
        const eps = String(blobs[k]).split('#');
        for (let j = eps.length - 1; j >= 0; j--) {
          const u = eps[j].slice(eps[j].indexOf('$') + 1).trim();
          if (/\.(m3u8|mp4)/i.test(u)) { playUrl = u; break; }
          if (!playUrl && /\/share\//i.test(u)) playUrl = u;
        }
      }
    }
  }

  // 真拉到流上量一次：分辨率 / 码率 / 首包 / 可用带宽
  let m = null;
  if (playUrl) {
    try { m = await measureStream(await resolvePlayUrl(playUrl)); } catch (e) { m = null; }
    if (m) { m.at = Date.now(); m.tid = best.tid; METRICS[s.api] = m; saveMetrics(); }
  }

  if (!m && best.tid) { METRICS[s.api] = Object.assign({}, METRICS[s.api] || {}, { tid: best.tid, at: Date.now() }); saveMetrics(); }

  const coverS = (cover / picks.length) * 40;                                   // 0-40
  const libS = Math.min(25, Math.log10(Math.max(total, 1)) / Math.log10(200000) * 25); // 0-25
  const dirS = direct ? 20 : 0;                                                 // 0-20
  const spdS = Math.max(0, 15 * (1 - (s.__catMs + listMs) / 5000));             // 0-15
  const qS = m && m.mbps ? Math.min(10, m.mbps * 2) : 0;                        // 0-10 清晰度
  const bS = m && m.speed ? Math.min(10, m.speed * 6) : 0;                      // 0-10 可用带宽
  return {
    score: Math.round((coverS + libS + dirS + spdS + qS + bS) * 10) / 10,
    faceScore: Math.round((coverS + libS + dirS) / 85 * 100),
    cover, coverOf: picks.length, total, direct, sample, playUrl,
    res: m ? m.res : '', mbps: m ? m.mbps : 0, speed: m ? m.speed : 0, ttfb: m ? m.ttfb : 0,
    catMs: Math.round(s.__catMs), listMs: Math.round(listMs), tid: best.tid
  };
}

function fmtNum(n) { return n >= 10000 ? (n / 10000).toFixed(1) + '万' : String(n || 0); }

async function autoPreset() {
  if (window.__presetDone || window.__presetRunning) { console.log('[preset] 已在跑，跳过'); return; }
  if (state.warehouses.length && localStorage.getItem('lanjue.preset') === '10') {
    console.log('[preset] 已预设，跳过');
    return;
  }
  localStorage.setItem('lanjue.preset', '10');
  window.__presetRunning = true;
  window.__presetDone = true;
  if (state.tab === 'home') renderHome();
  toast('正在接入 ' + PRESET_WHS.length + ' 个仓库源…');
  console.log('[preset] 并发拉取 ' + PRESET_WHS.length + ' 个仓库');
  const res = await Promise.allSettled(PRESET_WHS.map(loadOnePreset));
  res.forEach((r, i) => {
    const v = r.status === 'fulfilled' ? r.value : null;
    console.log('[preset] ' + PRESET_WHS[i].name + ' => ' + (v
      ? (v.spiderOnly ? '整仓 ' + v.spiderOnly + ' 站点全是爬虫源，跳过' : 'ok, ' + v.ok + ' 个 type1')
      : 'FAIL ' + ((r.reason && r.reason.message) || '')));
  });
  const good = res.filter(r => r.status === 'fulfilled' && r.value && r.value.id).map(r => r.value);
  if (!good.length) { window.__presetRunning = false; toast('预设源都没连上，请手动添加'); render(); return; }

  // 先把画面弄出来（不等评测），评测丢后台
  fastAttach(good);
  reportRank(good);
}

// 秒接入：优先上次评测的第一名，其次任一个能用的源。目标是把首屏变成 1-2 秒
function fastAttach(good) {
  let pick = null;
  try {
    const rk = JSON.parse(localStorage.getItem('lanjue.rank') || '[]');
    for (let i = 0; i < rk.length && !pick; i++) {
      const w = state.warehouses.find(x => x.name === rk[i].wh);
      const st = w && w.sites.find(x => x.name === rk[i].name && x.ok);
      if (w && st) pick = { w: w, s: st };
    }
  } catch (e) {}
  if (!pick) {
    for (let i = 0; i < good.length && !pick; i++) {
      const w = state.warehouses.find(x => x.id === good[i].id);
      if (!w) continue;
      const best = w.sites.filter(x => x.ok)
        .map(x => ({ x: x, k: siteRankKey(x) })).sort((a, b) => b.k - a.k)[0];
      if (best) pick = { w: w, s: best.x };
    }
  }
  if (!pick) return;
  state.activeWh = pick.w.id;
  state.site = pick.s.key;
  save();
  window.__presetRunning = false;
  console.log('[preset] 秒接入 ' + pick.w.name + ' / ' + pick.s.name);
  activateWarehouse();
  toast('已接入 ' + pick.w.name + '，后台挑最快源…');
}

/* 后台评测：测完只在明显更快时切源，不打断正在看的片 */
async function reportRank(good) {
  // 候选：每个仓库取最多 5 个 type1 源（按已知好评排序）
  const cands = [], seenHost = {};
  good.forEach(g => {
    const w = state.warehouses.find(x => x.id === g.id);
    if (!w) return;
    w.sites.filter(s => s.ok).slice(0, 5).forEach(s => {
      let host = String(s.api).replace(/^https?:\/\//, '').split('/')[0].toLowerCase();
      if (seenHost[host]) return;
      seenHost[host] = 1;
      cands.push({ w, s });
    });
  });
  console.log('[preset] 候选 ' + cands.length + ' 个，开始一轮探活');

  // 一轮：分类接口活不活 + 延迟
  const qs = await Promise.all(cands.map(c => quickProbe(c.s)));
  qs.forEach((q, i) => { cands[i].s.__catMs = q.ms; cands[i].cats = q.cats; });
  let alive = cands.map((c, i) => ({ ...c, cats: qs[i].cats, catMs: qs[i].ms }))
    .filter(c => c.cats.length >= 5)
    .sort((a, b) => (b.cats.length - a.cats.length) || (a.catMs - b.catMs));
  console.log('[preset] 一轮存活 ' + alive.length + ' 个');
  if (!alive.length) {
    window.__presetRunning = false;
    toast('源站都没响应，稍后重试');
    render(); return;
  }
  alive = alive.slice(0, 10);

  // 二轮：抽分类 + 详情验真，四维打分
  const probes = await Promise.all(alive.map(c => probeSite(c.s, c.cats).catch(() => ({ score: 0 }))));
  const rank = alive.map((c, i) => ({ ...c, ...probes[i] }))
    .filter(c => c.score > 0)
    .sort((a, b) => b.score - a.score);
  rank.forEach((r, i) => console.log('[rank' + (i + 1) + '] ' + r.w.name + ' / ' + r.s.name +
    ' 分=' + r.score + ' 覆盖=' + r.cover + '/' + r.coverOf + ' 库=' + fmtNum(r.total) +
    ' 直连=' + (r.direct ? 'Y' : 'N') + ' 画质=' + (r.res || '-') + ' 码率=' + (r.mbps || 0) + 'M' +
    ' 带宽=' + (r.speed || 0) + 'MB/s' + ' 分类' + r.catMs + 'ms 列表' + r.listMs + 'ms'));
  window.__presetRunning = false;
  if (!rank.length) {
    const w = state.warehouses.find(x => x.id === good[0].id);
    const s = w && (w.sites.find(x => x.ok) || w.sites[0]);
    if (w && s) { state.activeWh = w.id; state.site = s.key; save(); activateWarehouse(); }
    render(); toast('源站都能连但拉不到片');
    return;
  }
  try { localStorage.setItem('lanjue.rank', JSON.stringify(rank.slice(0, 6).map(r => ({
    wh: r.w.name, name: r.s.name, score: r.score, cover: r.cover, of: r.coverOf,
    total: r.total, direct: r.direct, catMs: r.catMs, listMs: r.listMs,
    res: r.res, mbps: r.mbps, speed: r.speed
  })))); } catch (e) {}

  // 清掉卡顿/残缺的源：测过且（无直连 或 带宽 < 0.5MB/s 或 接口 > 6s）的一律删，
  // 空着占位没意义，还会让选源时踩坑。
  const killed = [];
  alive.forEach((c, i) => {
    const r = probes[i] || {};
    // 卡不卡看"实测带宽能不能喂饱码率"，而不是拍一个绝对阈值
    const bwMbps = (r.speed || 0) * 8;              // 实测可用带宽(Mbps)
    const needMbps = (r.mbps || 1.5) * 1.2;         // 播这条流至少需要多少
    const slow = r.speed > 0 && bwMbps < Math.min(needMbps, 1.6);
    const bad = !r.cover || !r.direct || slow || (r.catMs > 7000) || (r.listMs > 7000);
    if (bad) killed.push({
      w: c.w, s: c.s,
      why: !r.cover ? '拉不到片' : (!r.direct ? '无直链' : (slow ? '带宽喂不动码率' : '接口太慢'))
    });
  });
  let removed = 0;
  if (killed.length) {
    killed.forEach(k => {
      const w = state.warehouses.find(x => x.id === k.w.id);
      if (!w) return;
      const rest = w.sites.filter(x => x.key !== k.s.key);
      if (rest.some(x => x.ok)) { w.sites = rest; removed++; }
      console.log('[clean] 删除 ' + k.w.name + ' / ' + k.s.name + ' → ' + k.why);
    });
    if (removed) {
      save();
      renderWh();
      render();
    }
  }

  const best = rank[0];
  const curS = curSite();
  const curK = curS ? siteRankKey(curS) : -1;
  const bestK = siteRankKey(best.s);
  const busy = $('#player').classList.contains('on') || curDetail || state.tab !== 'home';
  console.log('[preset] 评测最优 ' + best.w.name + ' / ' + best.s.name + ' 分=' + best.score +
    '；当前 ' + (curS ? curS.name : '无') + ' k=' + Math.round(curK) + ' vs ' + Math.round(bestK));
  if (busy || (curS && bestK <= curK * 1.15 + 5)) {
    console.log('[preset] 保持当前源不动');
    return;
  }
  state.activeWh = best.w.id;
  state.site = best.s.key;
  pendingTid = best.tid || null;
  save();
  console.log('[preset] 切到更快源 ' + best.w.name + ' / ' + best.s.name);
  activateWarehouse();
  const q = (best.res || '') + (best.mbps ? ' · ' + best.mbps + 'Mbps' : '') + (best.speed ? ' · ' + best.speed + 'MB/s' : '');
  toast('已切到最快源：' + best.s.name.replace(/[┃|]/g, '') + ' ' + q);
}

autoPreset();
