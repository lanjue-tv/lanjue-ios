/* ==================== 播放 ==================== */
const video = $('#video');
// 换源/历史续播时把"上次看到的时间点"带进来：元数据一到就 seek，不用等用户手动拖
let pendingResume = 0;
function applyResume() {
  if (pendingResume > 3 && isFinite(video.duration) && video.duration > pendingResume + 2 && video.currentTime < 1.5) {
    try { video.currentTime = pendingResume; } catch (e) {}
    pendingResume = 0;
    return true;
  }
  return false;
}
/* 播放器标题后面挂档位标签：优先用当前线路的实测数据，其次用源站测速记录 */
let pBaseTitle = '';
function pCurMetrics() {
  const d = playCtx && playCtx.d;
  const line = d && playCtx && d.lines[playCtx.li];
  if (line && line.m && (line.m.res || line.m.mbps)) return line.m;
  const site = detailSite || curSite();
  if (site && METRICS[site.api]) return METRICS[site.api];
  return null;
}
function pSyncTitleTag() {
  const el = $('#pTitle');
  if (!el) return;
  const tag = tierTag(pCurMetrics());
  el.innerHTML = esc(pBaseTitle || '') + tag;
}
function pSetTitle(t) { pBaseTitle = t || ''; pSyncTitleTag(); }

/* ---- 实时下载速度：只读 Resource Timing 里已经发生的分片请求，不发任何新请求 ----
   hls.js 的分片走 XHR，浏览器的资源计时里能拿到 transferSize，累计一下就够用了。
   原生 HLS（iPhone 网页版）拿不到分片信息 → 干脆不显示，绝不编数字。 */
let pSubBase = '', pSpdVal = 0, pSpdTimer = 0, pSpdSeen = null, pSpdQ = [], pSpdAt = 0;
const MEDIA_RE = /\.(ts|m4s|mp4|m4a|aac|mp3|key|m3u8)(\?|#|$)/i;
function pSetSub(t) { pSubBase = t || ''; pSpeedPaint(); }
function pSpeedPaint() {
  const el = $('#pSub');
  // 只写片名 + 线路名，不再挂小网速（用户要求去掉）
  if (el && el.textContent !== pSubBase) el.textContent = pSubBase;
  pSpinSpeed();
}
/* 「火速加载中」后面挂的实时速率：≥1.2MB/s 金色，≥0.45 绿色，其余红色 */
function pSpinSpeed() {
  const sp = $('#spinner'), b = $('#spinSpd');
  if (!sp || !b) return;
  if (!sp.classList.contains('on') || !(pSpdVal > 0)) {
    if (b.textContent) { b.textContent = ''; b.className = ''; }
    return;
  }
  const v = pSpdVal;
  const txt = '· ' + (v >= 1 ? v.toFixed(1) + 'MB/s' : Math.round(v * 1024) + 'KB/s');
  if (b.textContent !== txt) b.textContent = txt;
  const cls = v >= 1.2 ? 'sp-fast' : (v >= 0.45 ? 'sp-mid' : 'sp-slow');
  if (b.className !== cls) b.className = cls;
}
function pSpdSample() {
  let perf;
  try { perf = performance; } catch (e) { return; }
  if (!perf || !perf.getEntriesByType) return;
  const now = perf.now();
  let es;
  try { es = perf.getEntriesByType('resource'); } catch (e) { return; }
  if (!pSpdSeen) pSpdSeen = new Set();
  for (let i = 0; i < es.length; i++) {
    const e = es[i];
    if (!e || !e.responseEnd || e.responseEnd < now - 6000) continue;
    const k = e.name + '|' + Math.round(e.startTime);
    if (pSpdSeen.has(k)) continue;
    pSpdSeen.add(k);
    if (pSpdSeen.size > 400) pSpdSeen = new Set();
    if (!MEDIA_RE.test(e.name)) continue;
    const b = e.transferSize || 0;
    if (b <= 0) continue;
    pSpdQ.push({ t: e.responseEnd, b });
  }
  // 只留最近 4 秒的样本，跨度太短（刚起播）就先不报
  while (pSpdQ.length && pSpdQ[0].t < now - 4000) pSpdQ.shift();
  if (pSpdQ.length < 2) return;
  const span = (now - pSpdQ[0].t) / 1000;
  if (span < 1.2) return;
  let bytes = 0;
  for (let i = 0; i < pSpdQ.length; i++) bytes += pSpdQ[i].b;
  const v = bytes / span / 1048576;
  // 平滑一下，别一秒一个数乱跳
  pSpdVal = pSpdVal > 0 ? pSpdVal * 0.45 + v * 0.55 : v;
  pSpdAt = now;
}
function pSpdStart() {
  pSpdStop();
  pSpdVal = 0; pSpdQ = []; pSpdSeen = null; pSpdAt = 0;
  pSpeedPaint();
  pSpdTimer = setInterval(() => {
    pSpdSample();
    // 缓冲够用的时候 hls 会停一会儿不下载，20 秒没新样本才撤掉数字，避免忽有忽无
    if (pSpdVal > 0 && performance.now() - pSpdAt > 20000) pSpdVal = 0;
    pSpeedPaint();
  }, 1200);
}
/* hls.js 自己就在统计每个分片下了多久、多少字节（跨域拿不到 Resource Timing 的字节数，
   但这儿是白给的），直接用，不发任何额外请求。 */
function pSpdPush(data) {
  try {
    // hls.js 1.5 的统计挂在 frag.stats 上（payload.stats 在新版本里是空的）
    const st = (data && data.frag && data.frag.stats && !Array.isArray(data.frag.stats))
      ? data.frag.stats
      : ((data && data.payload && data.payload.stats && !Array.isArray(data.payload.stats)) ? data.payload.stats : null);
    if (!st) return;
    const bytes = st.total || st.loaded || 0;
    const l = st.loading || {};
    let v = 0;
    // 分片下载耗时可算得准；拿不到就退到 hls.js 自己的带宽估计（bps）
    if (bytes && l.start && l.end && l.end > l.start) v = bytes / (l.end - l.start) / 1048576;
    else if (st.bwEstimate) v = st.bwEstimate / 8 / 1048576;
    if (!v || v > 60) return;                                    // 太大＝本地缓存命中
    pSpdVal = pSpdVal > 0 ? pSpdVal * 0.5 + v * 0.5 : v;
    pSpdAt = performance.now();
    pSpeedPaint();
  } catch (e) {}
}
function pSpdStop() {
  if (pSpdTimer) { clearInterval(pSpdTimer); pSpdTimer = 0; }
  pSpdVal = 0; pSpdQ = []; pSpdSeen = null;
}

/* ---------- 省电：常亮与动画只在需要的时候开 ---------- */
// 播放中才让屏幕常亮；不播的时候让系统正常息屏（之前是一进 App 就永久常亮）
function keepAwake(on) {
  try { if (window.LanJue && window.LanJue.keepAwake) window.LanJue.keepAwake(!!on); } catch (e) {}
}
// 后台 / 播放中：把背景大光斑的无限动画挂起，省 GPU（播放时它本来就被视频盖住了）
function powIdle(on) {
  try { document.body.classList.toggle('powidle', !!on); } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  const p = document.getElementById('player');
  powIdle(document.hidden || !!(p && p.classList.contains('on')));
});
// 被系统/原生切到后台：立刻停下载、停解码，别在后台偷跑流量和电
let pLoadStopped = false;
window.__onAppPause = function () {
  try { if (video && !video.paused) video.pause(); } catch (e) {}
  try { if (hls && hls.stopLoad) { hls.stopLoad(); pLoadStopped = true; } } catch (e) {}
  keepAwake(false);
  powIdle(true);
};

async function openPlayer(id, startAt) {
  const it = state.items.find(i => i.id === id);
  if (!it) return;
  currentId = id;
  // 要起播了：把详情页还在跑的线路测速掐掉，别让它抢带宽拖慢首帧
  try { lineProbeSeq++; } catch (e) {}
  pSetTitle(it.title);
  const sub = it.source || (curSite() ? curSite().name : '');
  pSetSub(sub ? sub + (it.type === 'live' ? ' · 直播' : '') : '');
  const player = $('#player');
  player.classList.add('on');
  powIdle(true);          // 播放器打开：背景光斑动画挂起
  document.body.style.overflow = 'hidden';

  if (hls) { hls.destroy(); hls = null; }
  video.pause();
  video.removeAttribute('src');
  video.load();

  const live = it.type === 'live';
  video.loop = false;
  // startAt（换源/历史续播）优先于 item 自己记的进度
  const resumeAt = (!live && typeof startAt === 'number' && startAt > 3) ? startAt
    : (!live && it.progress > 3) ? it.progress : 0;
  pendingResume = resumeAt;

  // 关键：Android WebView 的 canPlayType 会谎报支持 HLS（返回 "maybe"）却播不了，
  // 所以只要 hls.js 可用就走 MSE，别信它自报；拿不到 hls.js 才退回原生。
  // 网页版反过来：iPhone Safari 没有 MSE（hls.js 用不了），它自带原生 HLS，直接交给 video 播。
  pRecover = { raw: it.url, relayed: false, switched: 0 };
  if (isHls(it.url) && !IS_WEB) {
    const ok = window.loadHls ? await window.loadHls() : false;
    if (ok && window.Hls && Hls.isSupported()) {
      console.log('[play] hls.js 接管 ' + it.url.slice(0, 70));
      hls = new Hls({
        maxBufferLength: 30,
        maxMaxBufferLength: 60,
        enableWorker: true,
        lowLatencyMode: false,
        backBufferLength: 30,
        // 手机屏幕小，别让 ABR 用"按播放器尺寸降档"的策略，默认就往高清走
        capLevelToPlayerSize: false,
        abrEwmaDefaultEstimate: 2500000,
        startLevel: -1,
        // 起播提速：不等带宽探测、直接抓首片，别为了选档位多等一个 RTT
        startFragPrefetch: true,
        testBandwidth: false
      });
      hls.loadSource(encUrl(it.url));
      hls.attachMedia(video);
      hls.on(Hls.Events.FRAG_LOADED, (e, data) => { pSpdPush(data); });
      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        pQualBuild();
        applyResume();
        if (!castDev) video.play().catch(() => {});
      });
      hls.on(Hls.Events.ERROR, (e, d) => {
        if (!d || !d.fatal) return;
        console.log('[play] hls fatal ' + d.type + ' / ' + d.details);
        if (d.type === Hls.ErrorTypes.NETWORK_ERROR) { try { hls.startLoad(); return; } catch (err) {} }
        if (d.type === Hls.ErrorTypes.MEDIA_ERROR) { try { hls.recoverMediaError(); return; } catch (err) {} }
        toast('这条流打不开，可能已失效');
      });
    } else {
      console.log('[play] hls.js 不可用，回退原生');
      video.src = encUrl(it.url);
    }
  } else {
    video.src = encUrl(it.url);
    video.addEventListener('loadedmetadata', function once() {
      video.removeEventListener('loadedmetadata', once);
      if (!applyResume() && resumeAt && resumeAt < video.duration - 2) video.currentTime = resumeAt;
    });
  }

  pSyncIcon();
  pSyncEpBtns();
  // 不是走"选集"进来的（本地片源/历史续播），也记一条历史
  if (!playCtx && !live) {
    // item 标题是「剧名 · 第01集」拼出来的，拆开存，才能和选集进来的记录并成一条
    const tp = String(it.title || '').split(' · ');
    recordHistory({
      name: tp[0] || it.title, epName: tp.length > 1 ? tp.slice(1).join(' · ') : '',
      pic: it.poster || '', url: it.url, itemId: it.id, siteName: it.source || ''
    });
  }
  // 投屏中换集/换源：把新地址重新推给电视，本机就不播了（省流量）
  if (castDev && castSupported()) {
    try { LanJue.castPlay(it.url, castDev.id); } catch (e) {}
  } else {
    video.play().catch(() => {});
  }
  pSpdStart();
  pShow();
}

function closePlayer() {
  keepAwake(false);       // 退出播放：恢复系统正常息屏
  powIdle(false);
  pLoadStopped = false;
  const it = state.items.find(i => i.id === currentId);
  if (it) {
    it.progress = video.currentTime || 0; it.duration = isFinite(video.duration) ? video.duration : 0; it.lastPlayed = Date.now();
    touchHistory(currentId, it.progress, it.duration);
    save();
  }
  video.pause();
  if (hls) { hls.destroy(); hls = null; }
  pQualLevels = []; pQualIdx = 0;
  if ($('#pQual')) { $('#pQual').style.display = 'none'; $('#pQual').textContent = '自动'; }
  video.removeAttribute('src');
  video.load();
  // 复位播放器状态
  if (typeof pStopLoop === 'function') pStopLoop();
  if (typeof pSpdStop === 'function') pSpdStop();
  if (typeof pHoldStop === 'function') pHoldStop();
  pSpinnerOff();
  if (typeof pOsdOff === 'function') pOsdOff();
  if (window.LanJue && typeof LanJue.resetBrightness === 'function') {
    try { LanJue.resetBrightness(); } catch (e) {}
  }
  if (typeof PL !== 'undefined') {
    PL.drag = false; PL.epOpen = false; PL.pendingSeek = -1; PL.lastTap = 0;
    clearTimeout(PL.hideT); clearTimeout(PL.hintT);
  }
  const sh = $('#pEpSheet'); if (sh) sh.classList.remove('on');
  const ss = $('#pSrcSheet'); if (ss) ss.classList.remove('on');
  const cs = $('#pCastSheet'); if (cs) cs.classList.remove('on');
  const sbg = $('#pSheetBg'); if (sbg) sbg.classList.remove('on');
  castOpen = false;
  if (typeof PL !== 'undefined') PL.srcOpen = false;
  const psrc = $('#pSrc'); if (psrc) psrc.style.display = 'none';
  const pcast = $('#pCast'); if (pcast) pcast.style.display = 'none';
  $('#pHint').classList.remove('on');
  $('#pctl').classList.remove('hide');
  $('#player').classList.remove('on', 'paused');
  document.body.style.overflow = '';
  currentId = null;
  playCtx = null;
  if (window.LanJue) {
    try { if (window.LanJue.landscape) window.LanJue.landscape(false); } catch (e) {}
    try { if (window.LanJue.immersive) window.LanJue.immersive(false); } catch (e) {}
  }
  if (typeof PL !== 'undefined') PL.fs = false;
  document.body.classList.remove('fsmode');
  render();
}

/* ==================== 观看历史（断点续播） ==================== */
// 同一部剧同一集只留一条：换源后 url 会更新成新源的，历史点进去永远是"上次的源 + 上次的进度"
function histKeyOf(name, epName) { return normKw(name) + '|' + normKw(epName || ''); }
function recordHistory(o) {
  // 从续播入口/本地片源进来时拿不到集名，如果同名剧已经有带集名的记录，就并进去，别多出一条
  if (!o.epName) {
    const same = state.history.find(h => normKw(h.name) === normKw(o.name) && h.epName);
    if (same) {
      o = Object.assign({}, o, {
        epName: same.epName, epIdx: same.epIdx, vid: o.vid || same.vid,
        api: o.api || same.api, siteName: o.siteName || same.siteName, siteKey: o.siteKey || same.siteKey
      });
    }
  }
  const k = histKeyOf(o.name, o.epName);
  const prev = state.history.find(h => h.key === k);
  state.history = state.history.filter(h => h.key !== k);
  // 已经有带集名的记录了，同名的“无集名”旧记录就是重复项，清掉
  if (o.epName) {
    const nn = normKw(o.name);
    state.history = state.history.filter(h => !(normKw(h.name) === nn && !h.epName));
  }
  const entry = Object.assign({
    key: k, at: Date.now(), progress: 0, duration: 0,
    name: '', epName: '', pic: '', url: '', itemId: '',
    vid: '', api: '', siteKey: '', siteName: '', epIdx: 0
  }, prev || {}, o, { key: k, at: Date.now() });
  state.history.unshift(entry);
  if (state.history.length > 60) state.history.length = 60;
  save();
}
// 播放中定期把进度写进历史（App 被杀也不丢）
let lastHistTouch = 0;
function touchHistory(itemId, progress, duration) {
  const h = state.history.find(x => x.itemId === itemId);
  if (!h) return;
  h.progress = progress || 0;
  if (duration > 0) h.duration = duration;
  h.at = Date.now();
  save();
}
// 按 api / key 在仓库里找回那个源（历史里存了 api 和 siteKey）
function siteByApiOrKey(api, key) {
  const all = [];
  state.warehouses.forEach(w => (w.sites || []).forEach(s => all.push(s)));
  const norm = x => String(x || '').replace(/\/+$/, '');
  if (key) { const a = all.find(s => String(s.key) === String(key)); if (a) return a; }
  if (api) {
    const b = all.find(s => String(s.api) === String(api)) || all.find(s => norm(s.api) === norm(api));
    if (b) return b;
  }
  return null;
}
/* 从历史续播时，播放器是直接拿片库里的 item 起播的（没有 playCtx），
   换源/上一集/下一集就全灰掉了。这里在后台把详情拉回来补上上下文，不阻塞起播。 */
async function restoreCtxFromHist(h, itemId) {
  try {
    if (!h || !h.vid) return;
    const site = siteByApiOrKey(h.api, h.siteKey);
    if (!site) return;
    const j = await getJSON(apiUrl(site.api, 'ac=videolist&ids=' + encodeURIComponent(h.vid)), 12000);
    const v = (j.list || [])[0];
    if (!v) return;
    if (currentId !== itemId) return;            // 用户已经退出或换片了，别瞎改
    const d = buildDetail(v, site, h.pic || '');
    let li = -1, ei = -1;
    const qen = normKw(h.epName || '');
    for (let i = 0; i < d.lines.length && ei < 0; i++) {
      const l = d.lines[i];
      if (l.direct <= 0 || !l.eps.length) continue;
      let k = qen ? l.eps.findIndex(e => normKw(e.name) === qen) : -1;
      if (k < 0 && (h.epIdx || 0) < l.eps.length) k = h.epIdx || 0;
      if (k < 0) k = 0;
      li = i; ei = k;
    }
    if (li < 0) return;
    d.li = li;
    curDetail = d;
    detailSite = site;
    playCtx = { d, li, ei };
    pSyncEpBtns();
    pSyncTitleTag();
    console.log('[hist] 已恢复剧集上下文 ' + d.name + ' / 线路' + li + ' / 第' + (ei + 1) + '集');
  } catch (e) {}
}

function resumeHistory(h) {
  if (!h) return;
  $('#maskHist').classList.remove('on');
  const it = state.items.find(x => x.id === h.itemId && x.url === h.url);
  if (it) {
    // 上次的链接还在片库里：直接续播（progress 里就是上次的时间点）
    if ((h.progress || 0) > 3) it.progress = h.progress;
    if ((h.duration || 0) > 0) it.duration = h.duration;
    openPlayer(it.id);
    restoreCtxFromHist(h, it.id);
    return;
  }

function aniGuessSub(name) {
  for (const s of ['cn', 'us', 'jp']) if (ANI_HIT[s](name)) return s;
  return '';

async function aniFindSearch(kw) {
  const q = String(kw || '').trim();
  const body = $('#aniFindBody');
  if (!body) return;
  if (!q) { toast('先输入想看的片名'); return; }
  const seq = ++aniFindSeq;
  const nq = normKw(q);
  body.innerHTML = '<div class="empty-sm">正在从所有源站找《' + esc(q) + '》'
    + (aniFindLang === 'mandarin' ? '的国语配音版' : '的全部版本') + '…</div>';

  // 跨仓库按质量排序的前 12 个源（不是只看当前源）。真机实测：24 源 5.9s、16 并发 5.5s，
  // 都不比 12 源 + 10 并发（约 3s）命中更多 —— 并发太高会互相抢带宽，速度优先维持这个组合。
  const pool = searchPool().slice(0, 12);
  if (!pool.length) { body.innerHTML = '<div class="empty-sm">还没有可用的源站</div>'; return; }

  const strict = new Map(), loose = new Map();
  // 搜"冰雪奇缘"源站会混进真人音乐剧/纪录片，这些不是动画片，直接丢掉
  const NON_ANI = /音乐剧|舞台剧|真人版|纪录片|幕后花絮|解说|预告片|原声集|以诺的|恶搞|恐怖版|惊悚版|MV$/i;
  const accept = (v, sk) => {
    const nm = String(v.vod_name || '').trim();
    if (!nm || !v.vod_id || NON_ANI.test(nm) || (HERO_JUNK && HERO_JUNK.test(nm))) return;
    const nn = normKw(nm);
    if (!nn || !(nn.indexOf(nq) >= 0 || nq.indexOf(nn) >= 0)) return;  // 片名要对得上（简称也认）
    let hard = false;
    if (aniFindLang === 'mandarin') {
      hard = mandarinOK(v, true);
      if (!hard && !mandarinOK(v, false)) return;   // 国语模式：明确粤语/原声的一律不要
    }
    const key = curatedKey(nm) || nn;
    const isCn = MANDARIN_YES.test(nm + ' ' + String(v.vod_remarks || ''));
    // 全部配音模式下，同一部片的国语版和原声版分开留着，让你自己挑；国语模式仍合成一条
    const dkey = aniFindLang === 'all' ? key + '|' + (isCn ? 'G' : 'O') : key;
    const m = {
      id: String(v.vod_id), name: aniDisp(nm), pic: v.vod_pic || '',
      rem: v.vod_remarks || '', y: heroYear(v), t: String(v.vod_time || v.vod_pubdate || ''),
      siteKey: sk, sub: aniGuessSub(nm), g: isCn ? 1 : 0
    };
    // 全部配音模式：不做国语判断，所有结果都进第一梯队展示
    const box = (aniFindLang === 'all' || hard) ? strict : loose, cur = box.get(dkey);
    if (!cur || (m.pic && !cur.pic) || (m.y > cur.y) || (m.t > cur.t && m.name.length <= cur.name.length)) box.set(dkey, m);
  };
  const jobs = [];
  pool.forEach(t => jobs.push({ site: t.s, kw: q }));
  pool.slice(0, 4).forEach(t => jobs.push({ site: t.s, kw: q + ' 国语' }));
  let ji = 0;
  const worker = async () => {
    while (ji < jobs.length && seq === aniFindSeq && !document.hidden) {
      const j = jobs[ji++];
      try {
        const jj = await getJSON(apiUrl(j.site.api, 'ac=videolist&wd=' + encodeURIComponent(j.kw)), 4200);
        (jj.list || []).forEach(v => accept(v, j.site.key));
      } catch (e) {}
    }
  };
  await Promise.all(Array.from({ length: 10 }, worker));
  if (seq !== aniFindSeq) return;

  const seen = new Set(), picks = [];
  strict.forEach((v, k) => { if (picks.length < 18) { seen.add(k); picks.push(v); } });
  // 严格国语太少（国产动画源站常不写"国语"）就用"没标原声"的补一点，别让用户空手而归
  if (picks.length < 4) loose.forEach((v, k) => { if (!seen.has(k) && picks.length < 12) { seen.add(k); picks.push(v); } });
  // 全部配音模式：国语版仍排前面（用户主要找国语），原声版紧跟其后
  picks.sort((a, b) => (aniFindLang === 'all' ? (b.g || 0) - (a.g || 0) : 0)
    || (b.y - a.y) || (b.t > a.t ? 1 : (b.t < a.t ? -1 : 0)));

  const recs = (await aniFindRecs(aniSimilar(q, picks), seq))
    .filter(r => !picks.some(p => curatedKey(p.name) === curatedKey(r.name)));
  if (seq !== aniFindSeq) return;

  aniFindCards = Object.create(null);
  [...picks, ...recs].forEach(v => { aniFindCards[String(v.siteKey) + '|' + String(v.id)] = v; });

  let html = picks.length
    ? `<div class="find-sec">《${esc(q)}》· 找到 ${picks.length} 部 <span>${aniFindLang === 'mandarin' ? '国语配音' : '全部配音'} · 长按可收藏</span></div>
       <div class="pgrid" id="aniFindGrid">${picks.map(vcardHTML).join('')}</div>`
    : `<div class="empty-sm">没找到《${esc(q)}》的国语配音版<br>换个片名试试，比如「哆啦A梦」「冰雪奇缘」</div>`;
  if (recs.length) {
    html += `<div class="find-sec">跟《${esc(q)}》类似 <span>${aniFindLang === 'mandarin' ? '都是国语配音' : '全部配音'}</span></div>
      <div class="pgrid" id="aniFindRecGrid">${recs.map(vcardHTML).join('')}</div>`;
  }
  body.innerHTML = html;
  $$('#maskAniFind .pcard').forEach(c => {
    bindCard(c);
    const old = c.onclick;
    c.onclick = function () { $('#maskAniFind').classList.remove('on'); old.call(this); };
  });
}

// 类似推荐：优先同一白名单片单里相邻位次的人气动画
function aniSimilar(q, picks) {
  const out = [], seen = new Set();
  const add = (name, sub) => {
    const k = curatedKey(name) || normKw(name);
    if (!k || seen.has(k)) return;
    seen.add(k); out.push({ name, sub });
  };
  const seeds = [];
  for (const s of ['cn', 'us', 'jp']) {
    const h = ANI_HIT[s](q);
    if (h) seeds.push({ sub: s, p: h.p });
  }
  if (!seeds.length) {
    for (const v of picks) {
      for (const s of ['cn', 'us', 'jp']) {
        const h = ANI_HIT[s](v.name);
        if (h) { seeds.push({ sub: s, p: h.p }); break; }
      }
      if (seeds.length >= 3) break;
    }
  }
  if (!seeds.length) {   // 白名单没命中：按字面相似度勉强挑几个片单
    const nq = normKw(q), cand = [];
    for (const s of ['cn', 'us', 'jp']) ANI_DB[s].forEach((row, i) => {
      const nk = normKw(row[0]); let sc = 0;
      for (const ch of nq) if (ch && nk.indexOf(ch) >= 0) sc++;
      if (sc) cand.push({ sub: s, p: i, sc });
    });
    cand.sort((a, b) => b.sc - a.sc);
    seeds.push(...cand.slice(0, 3).map(x => ({ sub: x.sub, p: x.p })));
  }
  const mainSub = seeds.length ? seeds[0].sub : 'jp';
  seeds.slice(0, 2).forEach(sd => {
    const db = ANI_DB[sd.sub];
    for (let d = 1; d <= 5 && out.length < 9; d++) {
      [sd.p - d, sd.p + d].forEach(i => { if (db[i]) add(db[i][0], sd.sub); });
    }
  });
  if (out.length < 6) {
    const db = ANI_DB[mainSub];
    for (let i = 0; i < db.length && out.length < 9; i++) add(db[i][0], mainSub);
  }
  return out;
}

// 推荐卡片：先吃专区缓存（0 网络），缺的再跨源补搜一小批
async function aniFindRecs(names, seq) {
  const out = [], todo = [];
  names.forEach(n => {
    const c = aniCfg(n.sub);
    const z = readZoneCache(c.cache, c.key, c.disp);
    const hit = (z ? z.list : []).find(v =>
      curatedKey(v.name) === curatedKey(n.name) || normKw(v.name) === normKw(n.name));
    if (hit) out.push(Object.assign({}, hit, { sub: n.sub }));
    else todo.push(n);
  });
  if (!todo.length) return out.slice(0, 9);

  const pool = searchPool().slice(0, 6);
  const jobs = [];
  todo.slice(0, 7).forEach(n => pool.slice(0, 2).forEach(t => jobs.push({ n, site: t.s })));
  let ji = 0;
  const map = new Map();
  const worker = async () => {
    while (ji < jobs.length && seq === aniFindSeq && !document.hidden) {
      const j = jobs[ji++];
      try {
        const jj = await getJSON(apiUrl(j.site.api, 'ac=videolist&wd=' + encodeURIComponent(j.n.name)), 3800);
        const nq = normKw(j.n.name);
        for (const v of (jj.list || [])) {
          const nm = String(v.vod_name || ''), nn = normKw(nm);
          if (!nn || !(nn.indexOf(nq) >= 0 || nq.indexOf(nn) >= 0)) continue;
          if (aniFindLang === 'mandarin' && (j.n.sub === 'cn' ? !mandarinOK(v, false) : !mandarinOK(v, true))) continue;
          const k = curatedKey(nm) || nn;
          if (!k || map.has(k)) continue;
          map.set(k, { id: String(v.vod_id), name: aniDisp(nm), pic: v.vod_pic || '',
            rem: v.vod_remarks || '', y: heroYear(v), t: String(v.vod_time || ''),
            siteKey: j.site.key, sub: j.n.sub });
          break;
        }
      } catch (e) {}
    }
  };
  await Promise.all(Array.from({ length: 10 }, worker));
  map.forEach(v => {
    if (out.length < 9 && !out.some(x => curatedKey(x.name) === curatedKey(v.name))) out.push(v);
  });
  // 兜底：白名单推荐的几部恰好没搜到时，直接拿同片单缓存里的国语动画补上，
  // 保证「类似推荐」这一栏不会空着（缓存本身就是之前国语过滤后的结果）。
  if (out.length < 5) {
    const mainSub = names.length ? names[0].sub : 'cn';
    const z = readZoneCache(aniCfg(mainSub).cache, curatedKey, aniDisp);
    (z ? z.list : []).forEach(v => {
      if (out.length >= 6) return;
      if (out.some(x => curatedKey(x.name) === curatedKey(v.name))) return;
      out.push(Object.assign({}, v, { sub: mainSub }));
    });
  }
  out.sort((a, b) => {
    const ia = names.findIndex(n => curatedKey(n.name) === curatedKey(a.name));
    const ib = names.findIndex(n => curatedKey(n.name) === curatedKey(b.name));
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
  });
  return out.slice(0, 9);
}

// 首页"继续观看"横排：只列真正看了一部分、还没看完的
function histStripHTML() {

}

/* ==================== 播放器控制（tvOS 风格） ==================== */
const PL = { drag: false, dragP: 0, hideT: 0, raf: 0, lastTap: 0, tapT: 0, hintT: 0, epOpen: false, pendingSeek: -1 };
// 投屏状态（提前声明：pSyncEpBtns 在初始化阶段也可能碰到它）

/* ---- 亮度 / 音量：左半屏上下调亮度，右半屏上下调音量，格子数直接糊在屏幕上 ---- */
const OSD_N = 15;
let osdT = 0, pBrightCache = 0.6;
const OSD_ICON = {

  bright: '<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/>'
};
function pBright() {

function pSetBright(v) {

function pSetVol(v) {

}
function pOsd(kind) {

/* ---- 进度条绘制：rAF 驱动，只改 transform，不重排 ---- */
function pPaint() {
  const d = isFinite(video.duration) ? video.duration : 0;
  const p = PL.drag ? PL.dragP : (d > 0 ? video.currentTime / d : 0);
  const pct = Math.max(0, Math.min(1, p || 0));
  $('#pFill').style.transform = 'scaleX(' + pct + ')';
  $('#pThumb').style.left = (pct * 100).toFixed(4) + '%';
  try {
    const b = video.buffered;
    if (b && b.length && d > 0) {
      let e = 0;
      for (let i = 0; i < b.length; i++) {
        if (b.start(i) <= video.currentTime + 1) e = Math.max(e, b.end(i));
      }
      $('#pBuf').style.transform = 'scaleX(' + Math.min(1, e / d) + ')';
    }
  } catch (err) {}
  if (!PL.drag) {
    $('#tCur').textContent = fmt(video.currentTime || 0);
    $('#tDur').textContent = d > 0 ? fmt(d) : '直播';
  }
}
function pLoop() {
  pPaint();
  PL.raf = requestAnimationFrame(pLoop);
}
function pStartLoop() { if (!PL.raf) PL.raf = requestAnimationFrame(pLoop); }
function pStopLoop() { if (PL.raf) { cancelAnimationFrame(PL.raf); PL.raf = 0; } pPaint(); }

  else if (kind === 'mute') ic.innerHTML = '<path d="M4 9.5v5h3.5L13 19V5L7.5 9.5z"/><path d="M17.5 9.5l4 4m0-4l-4 4"/>';
  else if (dir && dir < 0) ic.innerHTML = '<path d="M15 5l-7 7 7 7"/>';
  else if (dir && dir > 0) ic.innerHTML = '<path d="M9 5l7 7-7 7"/>';

/* ---- 跳转 ---- */
function pSkip(sec) {
  const d = isFinite(video.duration) ? video.duration : 0;
  let t = video.currentTime + sec;
  t = Math.max(0, d > 0 ? Math.min(d - 0.3, t) : t);
  video.currentTime = t;
  pPaint();
  pHint('seek', (sec > 0 ? '+' : '') + sec + 's  ' + fmt(t), sec);
  pShow();
}
function pSeekTo(t) {
  const d = isFinite(video.duration) ? video.duration : 0;
  video.currentTime = Math.max(0, d > 0 ? Math.min(d - 0.3, t) : t);
  pPaint();
}

/* ---- 进度条拖拽（pointer 事件，跟手不卡） ---- */
function seekRatio(e) {
  const r = $('#pTrack').getBoundingClientRect();
  return Math.max(0, Math.min(1, (e.clientX - r.left) / Math.max(1, r.width)));
}
const trackEl = $('#pTrack');
let trackDown = false;

trackEl.addEventListener('pointerdown', e => {
  e.preventDefault();
  trackDown = true;
  PL.drag = true;
  clearTimeout(PL.hideT);
  trackEl.classList.add('drag');
  PL.dragP = seekRatio(e);
  const d = isFinite(video.duration) ? video.duration : 0;
  if (d > 0) $('#tCur').textContent = fmt(PL.dragP * d);
  pPaint();
  trackEl.setPointerCapture(e.pointerId);
});
trackEl.addEventListener('pointermove', e => {
  if (!trackDown) return;
  PL.dragP = seekRatio(e);
  const d = isFinite(video.duration) ? video.duration : 0;
  if (d > 0) $('#tCur').textContent = fmt(PL.dragP * d);
  pPaint();
});
function endTrack(e) {
  if (!trackDown) return;
  trackDown = false;
  trackEl.classList.remove('drag');
  const d = isFinite(video.duration) ? video.duration : 0;
  if (d > 0) video.currentTime = Math.max(0, Math.min(d - 0.3, PL.dragP * d));
  PL.drag = false;

}
trackEl.addEventListener('pointerup', endTrack);

/* ---- 手势：横滑调进度、竖滑调音量、双击快进退、长按左右半屏连续快进退 ---- */
const gest = $('#pGest');
let g0 = null, gMode = '';
let holdT = 0, holdIv = 0, holdDir = 0, holdAcc = 0;
// 控制层是否收起（沉浸态）：亮度/音量手势只在这个时候生效
function pCtlHidden() {
  const c = $('#pctl');
  return !!(c && c.classList.contains('hide'));
}

// 长按按「播放器区域」的一半来分左右，不按 window：竖屏/横屏、全屏/非全屏都对
function pHalfDir(x) {
  const r = $('#player').getBoundingClientRect();
  return x < r.left + r.width / 2 ? -1 : 1;
}
function pHoldStop() {
  clearTimeout(holdT); holdT = 0;
  clearInterval(holdIv); holdIv = 0;
  holdDir = 0; holdAcc = 0;
}
function pHoldTick() {
  if (!holdDir) return;
  const d = isFinite(video.duration) ? video.duration : 0;
  let t = (video.currentTime || 0) + holdDir * 10;
  t = Math.max(0, d > 0 ? Math.min(d - 0.4, t) : t);
  try { video.currentTime = t; } catch (e) {}
  holdAcc += 10;
  pHint('seek', (holdDir > 0 ? '长按快进 +' : '长按快退 −') + holdAcc + 's · ' + fmt(t), holdDir);
  pPaint();
}
function pHoldStart(dir) {
  holdDir = dir;
  holdAcc = 0;
  pShow();
  pHoldTick();
  holdIv = setInterval(pHoldTick, 300);
}

gest.addEventListener('pointerdown', e => {
  if (PL.epOpen) return;
  g0 = { x: e.clientX, y: e.clientY, t: video.currentTime, vol: video.volume, bright: pBright(),
         right: pHalfDir(e.clientX) > 0, moved: false, held: 0 };
  gMode = '';
  PL.pendingSeek = -1;
  pHoldStop();
  // 按住不动 400ms → 进入长按快进退
  holdT = setTimeout(() => {
    if (!g0 || g0.moved) return;
    g0.held = pHalfDir(g0.x);
    pHoldStart(g0.held);
    try { if (navigator.vibrate) navigator.vibrate(6); } catch (err) {}
  }, 400);
  try { gest.setPointerCapture(e.pointerId); } catch (err) {}
});
gest.addEventListener('pointermove', e => {
  if (!g0) return;
  if (g0.held) return;                      // 长按中：手指怎么晃都保持快进退
  const dx = e.clientX - g0.x, dy = e.clientY - g0.y;
  if (!gMode) {
    if (Math.abs(dx) > 14 || Math.abs(dy) > 14) {
      pHoldStop();                          // 真滑动了就不算长按（阈值放宽到 14px，长按时手指抖几下不会误判）
      g0.moved = true;
    }
    if (Math.abs(dx) > 14 && Math.abs(dx) > Math.abs(dy) * 1.2) gMode = 'seek';
    else if (Math.abs(dy) > 14 && Math.abs(dy) > Math.abs(dx) * 1.2) {
      // 亮度/音量只在「沉浸态」（控制层收起）生效：有控制条的时候手指是在找按钮，
      // 顺手一划就把音量亮度带跑很容易误触。
      if (!pCtlHidden()) { g0.moved = true; return; }
      gMode = g0.right ? 'vol' : 'bright';
    }
    else return;
  }
  if (gMode === 'seek') {
    const d = isFinite(video.duration) ? video.duration : 0;
    if (d <= 0) return;
    const span = Math.max(60, Math.min(240, d * 0.25));
    const t = Math.max(0, Math.min(d, g0.t + dx / window.innerWidth * span));
    PL.pendingSeek = t;
    pHint('seek', fmt(t) + '  ' + (t - g0.t >= 0 ? '+' : '') + Math.round(t - g0.t) + 's', dx > 0 ? 1 : -1);
    $('#tCur').textContent = fmt(t);
    PL.dragP = t / d;
    $('#pFill').style.transform = 'scaleX(' + PL.dragP + ')';
    $('#pThumb').style.left = (PL.dragP * 100) + '%';
  } else if (gMode === 'vol' || gMode === 'bright') {
    // 上滑加、下滑减；横屏竖屏给个固定的手感距离，别因为屏幕高度不同过快或过慢
    const span = Math.max(240, Math.min(330, (window.innerHeight || 800) * 0.42));
    const dv = -dy / span;
    if (gMode === 'vol') pSetVol(g0.vol + dv);
    else pSetBright(g0.bright + dv);
  }
});
gest.addEventListener('pointerup', e => {
  if (!g0) return;
  const wasMode = gMode;
  const held = g0.held;
  const px = e.clientX / window.innerWidth;
  pHoldStop();
  if (held) {
    // 长按结束：不再当作单击/双击，回到正常控制态
    pPaint();
    pShow();
    g0 = null; gMode = '';
    return;
  }
  if (wasMode === 'seek' && PL.pendingSeek >= 0) {
    pSeekTo(PL.pendingSeek);
    PL.pendingSeek = -1;
    pShow();
  } else if (wasMode === 'vol' || wasMode === 'bright') {
    // 沉浸态调完就保持沉浸：弹控制条反而会挡住下一次滑动，还得再点一下才能继续调
  } else if (!g0.moved) {
    // 单击 / 双击判定：单击只切换一次显隐，别再做第二遍
    const now = Date.now();
    if (now - PL.lastTap < 300) {
      clearTimeout(PL.tapT);
      PL.lastTap = 0;
      if (px < 0.34) pSkip(-10);
      else if (px > 0.66) pSkip(10);
      else { video.paused ? video.play().catch(() => {}) : video.pause(); }
      pShow();
    } else {
      PL.lastTap = now;
      clearTimeout(PL.tapT);
      PL.tapT = setTimeout(() => {
        PL.lastTap = 0;
        pToggleCtl();
      }, 240);
    }
  }
  g0 = null; gMode = '';
});
gest.addEventListener('pointercancel', () => { pHoldStop(); g0 = null; gMode = ''; });

/* ---- 播放器内换源：进度无缝衔接 ---- */
// 收集同片名的其他源候选（搜索缓存优先；没有就现场并发搜一遍，6 秒内出的才算数）
// 同一片名在途时共享同一个搜索（详情预热和失败抢救可能同时要）
const xsrcInflight = new Map();
async function collectCrossSource(kw) {
  const q = normKw(kw);
  const cached = titleCands.get(q);
  if (cached && cached.length) return cached.slice();
  if (xsrcInflight.has(q)) return xsrcInflight.get(q);
  const p = (async () => {
    // 索引命中：立刻返回候选清单（0 网络），搜索只放到后台刷新，不挡开门
    const ix = idxGet(q);
    if (ix && ix.length) {
      const out = [];
      ix.forEach(x => {
        const s = siteByKey(x.k);
        if (!s) return;
        // 优先用"这部片自己的实测"（比源级历史准得多），没有才退到源级
        const m = hitGet(s.api, x.i) || METRICS[s.api] || {};
        out.push({ id: String(x.i), name: String(kw), pic: x.p || '', site: s, rank: 0,
          res: m.res || '', mbps: m.mbps || 0, speed: m.speed || 0, cnt: 1 });
      });
      if (out.length) {
        out.sort(cmpCand);
        titleCands.set(q, out.slice(0, 3));
        idxSearch(q, kw, true).catch(() => {});
        return out.slice(0, 3);
      }
    }
    const full = await idxSearch(q, kw, false);
    return full;
  })();
  xsrcInflight.set(q, p);
  try { return await p; } finally { xsrcInflight.delete(q); }
}
/* 全源搜同名片。soft=true 表示"后台刷新"：只更新索引，不参与当前判定。 */
async function idxSearch(q, kw, soft) {
  const pool = searchPool().slice(0, 12);
  const out = [];
  let settled = 0;
  const jobs = pool.map(t => (async () => {
    try {
      const j = await getJSON(apiUrl(t.s.api, 'ac=videolist&wd=' + encodeURIComponent(kw)), 4000);
      const hit = (j.list || []).find(v => v && v.vod_name && normKw(v.vod_name) === q);
      if (hit) {
        idxAdd(kw, t.s, hit.vod_id, hit.vod_pic);
        if (!soft) {
          const m = hitGet(t.s.api, hit.vod_id) || METRICS[t.s.api] || {};
          out.push({
            id: String(hit.vod_id), name: String(hit.vod_name), pic: hit.vod_pic || '',
            site: t.s, rank: t.rank, res: m.res || '', mbps: m.mbps || 0, speed: m.speed || 0, cnt: 1
          });
        }
      }
    } catch (e) {}
    settled++;
  })());
  if (soft) { await Promise.all(jobs); return []; }
  // 竞速：全体回齐 或 1.6 秒到点（先拿到的候选先开始测，晚到的继续在后台补索引）
  await Promise.race([Promise.all(jobs), new Promise(r => setTimeout(r, 1600))]);
  out.sort(cmpCand);
  if (settled >= pool.length) { titleCands.set(q, out.slice(0, 3)); return out.slice(0, 3); }
  return out;
}

// 换源核心：记住当前时间 → 拉新源详情 → 找同名/同序的集 → 从原时间点继续播
async function switchSource(cand) {
  if (!playCtx || !playCtx.d) return;
  const t = video.currentTime || 0;
  const curLine = playCtx.d.lines[playCtx.li];
  const curEpName = curLine && curLine.eps[playCtx.ei] ? curLine.eps[playCtx.ei].name : '';
  const curEi = playCtx.ei;
  toast('正在切到 ' + String(cand.site.name || '').replace(/[┃|]/g, '') + ' …');
  try {
    const j = await getJSON(apiUrl(cand.site.api, 'ac=videolist&ids=' + encodeURIComponent(cand.id)), 12000);
    const v = (j.list || [])[0];
    if (!v) throw new Error('没拿到详情');
    const nd = buildDetail(v, cand.site, cand.pic);
    if (!nd.lines.some(l => l.direct > 0)) throw new Error('这个源没有直链线路');
    // 集名对得上就按集名走，对不上就按序号兜底
    let li = -1, ei = -1;
    const qen = normKw(curEpName);
    for (let i = 0; i < nd.lines.length && ei < 0; i++) {
      if (nd.lines[i].direct <= 0 || !nd.lines[i].eps.length) continue;
      const l = nd.lines[i];
      let k = qen ? l.eps.findIndex(e => normKw(e.name) === qen) : -1;
      if (k < 0 && curEi < l.eps.length) k = curEi;
      if (k < 0) k = 0;
      li = i; ei = k;
    }
    if (li < 0) throw new Error('这个源没有对应剧集');
    nd.li = li;
    curDetail = nd;
    detailSite = cand.site;
    // playEp 里会重立 playCtx、记历史、带 startAt 打开播放器 → 进度无缝
    playEp(nd.lines[li].eps[ei], ei, t);
    pSyncEpBtns();
    toast('已换源 · 从 ' + fmt(t) + ' 继续');
  } catch (e) {
    toast('换源失败：' + (e.message || '未知错误'));
  }
}

$('#pFs').onclick = () => {
  const p = $('#player');

  PL.fs = !PL.fs;

    // 原生横屏 + 沉浸：视频层不动，hls.js 连接不会断
    try { window.LanJue.landscape(PL.fs); } catch (e) {}

    document.body.classList.toggle('fsmode', PL.fs);

    // iOS Safari：只有 <video> 支持 webkitEnterFullscreen，容器没有标准全屏 API
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
      || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (isIOS && video.webkitEnterFullscreen) {

      if (PL.fs) {
        const fn = p.requestFullscreen || p.webkitRequestFullscreen;
        if (fn) { try { fn.call(p); } catch (e) {} }
      } else {

let pQualLevels = [], pQualIdx = 0;
function pQualBuild() {
  const btn = $('#pQual');
  if (!btn) return;
  pQualLevels = [];
  if (hls && hls.levels && hls.levels.length > 1) {
    const seen = {};
    hls.levels.forEach((lv, i) => {
      const h = lv.height || 0;
      const label = h ? h + 'P' : (Math.round((lv.bitrate || 0) / 1000) + 'k');
      if (seen[label]) return;
      seen[label] = 1;
      pQualLevels.push({ i: i, label: label, h: h, br: lv.bitrate || 0 });
    });
    pQualLevels.sort((a, b) => (b.h - a.h) || (b.br - a.br));
  }
  pQualIdx = 0;
  btn.style.display = pQualLevels.length ? '' : 'none';
  btn.textContent = '自动';
}
if ($('#pQual')) $('#pQual').onclick = () => {
  if (!hls || !pQualLevels.length) return;
  pQualIdx = (pQualIdx + 1) % (pQualLevels.length + 1);
  const btn = $('#pQual');
  if (pQualIdx === 0) { hls.currentLevel = -1; btn.textContent = '自动'; toast('画质 自动'); return; }
  const lv = pQualLevels[pQualIdx - 1];
  hls.currentLevel = lv.i;
  btn.textContent = lv.label;
  toast('画质 ' + lv.label);
};

/* ---- 播放抢救：直连不通 → 走本机 HLS 通道 → 自动换源，不让用户干瞪报错 ---- */
function pAttachNative(u) {
  try { if (hls) { hls.destroy(); hls = null; } } catch (e) {}
  video.pause();
  video.removeAttribute('src');
  video.load();
  video.src = encUrl(u);
  video.addEventListener('loadedmetadata', function once() {
    video.removeEventListener('loadedmetadata', once);
    if (!applyResume() && pendingResume && pendingResume < (video.duration || 0) - 2) video.currentTime = pendingResume;
  });
  video.play().catch(() => {});
}

async function pRecoverFromError() {
  const it = state.items.find(i => i.id === currentId);
  if (!it) return;
  const rc = pRecover || (pRecover = { raw: it.url, relayed: false, switched: 0 });
  // 媒体可能连抛几次 error：2.5 秒内只处理一次，别把换源触发成一串
  const now = Date.now();
  if (rc.t && now - rc.t < 2500) return;
  rc.t = now;
  const code = (video.error && video.error.code) || 0;
  console.log('[play] 播放失败 code=' + code + ' url=' + String(it.url).slice(0, 90));

  // 1) 直连放不了，先换本机 HLS 通道：能绕开中文路径没编码 / 防盗链查 Referer / CDN 挑 UA
  if (!rc.relayed && localGate() && isHls(it.url)) {
    rc.relayed = true;
    pSpinnerOn('换个通道再试…');
    const gate = '/h?u=' + encodeURIComponent(it.url);
    try {
      const r = await fetch(gate, { cache: 'no-store' });
      if (r.ok) { pAttachNative(gate); return; }
    } catch (e) {}
    pSpinnerOff();
  }

  // 2) 这条源真不通：自动换同名片的其它源播，进度接着来
  if (rc.switched < 1) {
    rc.switched++;
    // 这条源既然播不了，就别再记它"最优"，否则下次点开还是先撞一次墙
    try {
      const q = normKw(String(it.title || '').split(' · ')[0]);
      if (q && BEST[q]) { delete BEST[q]; bestSave(); }
    } catch (e) {}
    pSpinnerOn('这条源播不了，正在换源…');
    const nm = String(it.title || '').split(' · ')[0];
    try {
      const cands = await collectCrossSource(nm);
      const cur = String(it.source || '').replace(/[┃|]/g, '').trim();
      const next = (cands || []).find(c => {
        const sn = String((c.site && c.site.name) || '').replace(/[┃|]/g, '').trim();
        return sn && sn !== cur;
      });
      if (next && playCtx && playCtx.d) {
        pSpinnerOff();
        switchSource(next);
        return;
      }
    } catch (e) {}
  }
  pSpinnerOff();
  toast('这条源播不了，点「换源」挑别的线路');
}

function guessName(u) {
  try {
    const p = new URL(u, 'https://x').pathname.split('/').filter(Boolean).pop() || '未命名';
    return decodeURIComponent(p.replace(/\.[a-z0-9]+$/i, '')) || '未命名';
  } catch (e) { return '未命名'; }
}
function parseM3U(text) {
  const out = [];
  const lines = String(text).split(/\r?\n/);
  let cur = null;
  for (const raw of lines) {
    const l = raw.trim();
    if (!l) continue;
    if (/^#EXTINF/i.test(l)) {
      const name = (l.split(',').slice(1).join(',') || '').trim() || '未命名频道';
      const logo = (l.match(/tvg-logo="([^"]*)"/i) || [])[1] || '';
      const grp = (l.match(/group-title="([^"]*)"/i) || [])[1] || '';
      cur = { title: name, logo, grp };
    } else if (!l.startsWith('#')) {
      if (/^(https?|rtmp|rtsp):\/\//i.test(l)) {
        out.push({ title: (cur && cur.title) || guessName(l), url: l, grp: (cur && cur.grp) || '' });
      }
      cur = null;
    }
  }
  return out;
}

/* ==================== 仓库源（TVBox 接口协议） ==================== */
let disc = { tid: '', page: 1, list: [], cats: [], loading: false, done: false, err: '' };
let failoverTried = new Set();
let pendingTid = null;   // 探活时确认有内容的分类，优先用它

// 源站挂了自动换同仓库的下一个可用站，最多试 5 个
function autoFailover(site) {
  failoverTried.add(String(site.key));
  if (failoverTried.size > 5) { console.log('[failover] 已试 5 个，放弃'); return false; }
  const w = state.warehouses.find(x => x.id === state.activeWh);
  if (!w) return false;
  const next = w.sites.find(s => s.ok && !failoverTried.has(String(s.key)));
  if (!next) { console.log('[failover] 无可换站点'); return false; }
  state.site = next.key;
  save();
  console.log('[failover] ' + site.name + ' 无响应 → 换到 ' + next.name);
  toast('源站无响应，已换到 ' + next.name);
  disc.loading = true; disc.err = '';
  loadCats();
  return true;
}
let curDetail = null, detailSite = null, searchResults = [];
let whView = 'list', whPending = null;

function curSite() {
  if (!state.activeWh || !state.site) return null;
  const w = state.warehouses.find(x => x.id === state.activeWh);
  if (!w) return null;
  return w.sites.find(s => String(s.key) === String(state.site)) || null;
}

function apiUrl(api, qs) {
  const base = String(api || '').replace(/\/+$/, '');
  return base + (base.indexOf('?') >= 0 ? '&' : '?') + qs;
}

/* 网页版（浏览器直接打开）必须走同源转发：绝大多数源站接口不发 CORS 头，浏览器会直接拦掉；
   安卓 App 是 file:// + WebView 放行跨域（setAllowUniversalAccessFromFileURLs），走直连最快。 */
const IS_WEB = /^https?:$/.test(location.protocol);
function relay(u) {
  if (!IS_WEB || !u) return u;
  return 'p?u=' + encodeURIComponent(u);
}

async function getJSON(url, ms) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms || 15000);
  try {
    const r = await fetch(relay(url), { signal: ctrl.signal, headers: { 'Accept': 'application/json,text/plain,*/*' } });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const txt = await r.text();
    const j = parseMaybeJSON(txt);
    if (!j) throw new Error('返回的不是 JSON');
    return j;
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('请求超时');
    throw e;
  } finally {
    clearTimeout(timer);
  }
}
function parseMaybeJSON(txt) {
  const t = String(txt).replace(/^\uFEFF/, '').trim();
  // 有些仓库（比如 liucn 的 m.json）在 JSON 里夹着 // 注释行，直接 parse 必炸。
  // 只删"行首"的注释，绝不碰 https:// 里的双斜杠。
  const noCmt = t
    .replace(/^[ \t]*\/\/[^\n]*$/gm, '')
    .replace(/^[ \t]*\/\*[\s\S]*?\*\/[ \t]*$/gm, '')
    .trim();
  const cands = [t, noCmt, noCmt.replace(/,\s*([}\]])/g, '$1'), t.replace(/,\s*([}\]])/g, '$1')];
  for (let i = 0; i < cands.length; i++) {
    try { const j = JSON.parse(cands[i]); if (j && typeof j === 'object') return j; } catch (e) {}
  }
  const i0 = noCmt.indexOf('{'), j0 = noCmt.lastIndexOf('}');
  if (i0 >= 0 && j0 > i0) { try { return JSON.parse(noCmt.slice(i0, j0 + 1)); } catch (e) {} }
  return null;
}

/* ---------- 仓库解析 ---------- */
function normalizeWh(j) {
  const arr = j.urls || j.storeHouse;
  if (Array.isArray(arr) && arr.length) {
    return {
      multi: true,
      list: arr.map((x, i) => ({
        name: x.name || x.sourceName || ('仓库 ' + (i + 1)),
        url: x.url || x.sourceUrl
      })).filter(x => x.url)
    };
  }
  return { multi: false, sites: extractSites(j) };
}

function extractSites(j) {
  const arr = Array.isArray(j) ? j : (Array.isArray(j.sites) ? j.sites : []);
  return arr.map(s => {
    const api = s.api || s.url || '';
    const ok = /^https?:\/\//i.test(api) && api.indexOf('csp_') !== 0;
    return {
      key: String(s.key || s.name || api),
      name: String(s.name || s.key || '未命名'),
      api, ok,
      searchable: s.searchable !== 0
    };
  }).filter(s => s.name && s.api);
}

async function fetchSites(url) {
  const j = await getJSON(url, 20000);
  if (!j) throw new Error('空的响应');
  const n = normalizeWh(j);
  if (n.multi) return n;
  if (!n.sites.length) throw new Error('没解析出任何源站');
  return n;
}

// 实测质量排序：这些源在 2026-11 时列表/搜索都正常，排在前面
const GOOD_SITES = ['暴风', '非凡', '量子', '极速', '光速', '新浪', '电影天堂', '建安', '百度', '闪电', '红牛'];
function rankSite(s) {
  const n = String(s.name || '');
  for (let i = 0; i < GOOD_SITES.length; i++) if (n.indexOf(GOOD_SITES[i]) >= 0) return i;
  return 99;
}
function sortSites(arr) {
  return arr.sort((a, b) => (b.ok ? 1 : 0) - (a.ok ? 1 : 0) || rankSite(a) - rankSite(b));
}

function saveWh(name, url, sites) {
  const exist = state.warehouses.find(w => w.url === url);
  if (exist) {
    exist.name = name || exist.name;
    exist.sites = sortSites(sites);
    state.activeWh = exist.id;
  } else {
    const w = { id: uid(), name: name || guessName(url), url, sites: sortSites(sites) };
    state.warehouses.push(w);
    state.activeWh = w.id;
  }
  const w = state.warehouses.find(x => x.id === state.activeWh);
  const first = w.sites.find(s => s.ok);
  if (first) state.site = first.key;
  save();
}

/* ---------- 本地快照：让首页 0 网络就出画面 ---------- */
function snapKeyOf(api) { return 'lanjue.snap.' + String(api || '').slice(0, 150); }
function saveSnap(site, tid, list, cats) {

  try {

    }));

}
function readSnap(site) {

    const j = JSON.parse(localStorage.getItem(snapKeyOf(site.api)) || 'null');
    if (j && Array.isArray(j.list) && j.list.length) return j;
  } catch (e) {}

}
/* ---------- 超英专区缓存：开机先铺上次的片单（0 网络），再后台刷新 ---------- */
const HERO_CACHE = 'lanjue.hero.v1';
function saveHeroCache(cats, list) {
  try {
    localStorage.setItem(HERO_CACHE, JSON.stringify({
      at: Date.now(), cats: (cats || []).slice(0, 40), list: (list || []).slice(0, 130)
    }));
  } catch (e) {}
}
function readHeroCache() {
  try {
    const j = JSON.parse(localStorage.getItem(HERO_CACHE) || 'null');
    if (j && Array.isArray(j.list) && j.list.length) {
      // 老缓存里可能同时存着「死侍与金刚狼」和它的中英双语版两条，读的时候先按 key 去重
      const m = new Map();
      j.list.forEach(v => {
        const k = heroKey(v.name) || normKw(v.name);
        if (!k || !v.id) return;
        const cur = m.get(k);
        if (!cur || (v.y || 0) > (cur.y || 0)) m.set(k, Object.assign({}, v, { name: heroDisp(v.name) }));
      });
      if (m.size) j.list = [...m.values()];
      return j;
    }
  } catch (e) {}
  return null;
}

// 开机第一步：把上次的列表直接铺出来（渲染成本几乎为 0，不用等网络）
// 默认栏目 = 超英专区，所以优先铺超英缓存
function restoreSnap() {
  const hc = readHeroCache();
  if (hc) {
    disc.cats = fixCats(hc.cats || []);
    disc.tid = CAT_HERO.id;
    disc.list = hc.list;
    disc.done = false; disc.loading = true; disc.err = '';
    renderHome();
    const mins = Math.round((Date.now() - (hc.at || 0)) / 60000);
    console.log('[snap] 超英专区秒开 ' + hc.list.length + ' 部（' + (mins < 1 ? '刚刚' : mins + ' 分钟前') + '的缓存）');
    return true;
  }
  const site = curSite();
  const sn = readSnap(site);
  if (!sn) return false;
  disc.cats = fixCats(sn.cats || []);
  disc.tid = CAT_HERO.id;                       // 冷启动默认就是超英专区
  disc.list = [];                               // 旧的分类片单对不上，先空着，别闪错内容
  disc.done = false;
  disc.loading = true;
  disc.err = '';
  renderHome();
  const mins = Math.round((Date.now() - (sn.at || 0)) / 60000);
  console.log('[snap] 秒开 ' + sn.list.length + ' 条（' + (mins < 1 ? '刚刚' : mins + ' 分钟前') + '的缓存）');
  return true;
}

/* ---------- 数据加载 ---------- */
// 开机选源：优先用用户自己选的那个（给它一点抢先时间），它不响应才换最快的备位。
// 绝不串行等超时——一个源挂掉就白等十几秒。
async function pickLiveSite() {
  const cur = curSite();
  const curW = state.warehouses.find(x => x.id === state.activeWh);
  const seen = {};
  const others = [];
  const pushOther = (w, st) => {
    if (!w || !st || !st.ok) return;
    const k = String(st.key);
    if (seen[k]) return;
    seen[k] = 1;
    others.push({ w, s: st, rank: siteRankKey(st) });
  };
  if (cur) seen[String(cur.key)] = 1;
  if (curW) curW.sites.filter(x => x.ok && String(x.key) !== String(state.site))
    .map(x => ({ x, k: siteRankKey(x) })).sort((a, b) => b.k - a.k).slice(0, 2)
    .forEach(o => pushOther(curW, o.x));
  state.warehouses.forEach(w => {
    if (curW && w.id === curW.id) return;
    const best = w.sites.filter(x => x.ok)
      .map(x => ({ x, k: siteRankKey(x) })).sort((a, b) => b.k - a.k)[0];
    if (best) pushOther(w, best.x);
  });
  others.sort((a, b) => b.rank - a.rank);
  const head = others.slice(0, 4);

  const ask = (c, ms) => getJSON(apiUrl(c.s.api, 'ac=list'), ms)
    .then(j => ({ w: c.w, s: c.s, j })).catch(() => null);
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  // 备位：谁最先答应用谁，但结果押后 350ms 交出来，给当前源一个抢先窗口
  const othersRace = (async () => {
    if (!head.length) return null;
    return new Promise(resolve => {
      let left = head.length, done = false;
      head.forEach(c => ask(c, 4500).then(r => {
        if (done || !r) return;
        done = true;
        resolve(r);
      }).catch(() => {
        if (--left === 0 && !done) { done = true; resolve(null); }
      }));
    });
  })().then(r => r ? sleep(900).then(() => r) : null);

  if (!cur) return othersRace;
  // 当前源失败常常是刚开机网络还没起来，补一次短重试
  const curFlow = (async () => {
    let r = await ask({ w: curW, s: cur }, 1800);
    if (!r) r = await ask({ w: curW, s: cur }, 2400);
    if (r) return r;
    return othersRace;
  })();
  const first = await Promise.race([curFlow, othersRace]);
  // 备位全挂（返回 null）时，再给当前源一次机会，别在它还在重试时就报错
  return first || await curFlow;
}

async function loadCats() {
  if (!state.warehouses.some(w => w.sites.some(x => x.ok))) { disc.loading = false; renderHome(); return; }
  disc.loading = true; disc.err = '';
  if (!disc.list.length) renderHome();
  prefetchFirstPage();          // 分类 id 已知就先抓第一页，和下面的 ac=list 并行
  const win = await pickLiveSite();
  if (!win) {
    disc.loading = false;
    disc.err = '源站都没响应';
    const cur = curSite();
    if (cur && autoFailover(cur)) return;
    renderHome();
    return;
  }
  const site = win.s;
  if (String(state.site) !== String(site.key) || state.activeWh !== win.w.id) {
    const prevName = (curSite() || {}).name || '';
    state.site = site.key; state.activeWh = win.w.id; save();
    console.log('[boot] 最先响应：' + site.name + '（' + win.w.name + '），原源 ' + prevName + ' 没响应');
    toast(prevName ? '原源无响应，已切到 ' + site.name.replace(/[┃|]/g, '') : '已接入 ' + site.name.replace(/[┃|]/g, ''));
  }
  const arr = win.j.class || win.j.categories || [];
  disc.cats = fixCats(arr.map(c => ({ id: String(c.type_id), name: String(c.type_name) })).filter(c => c.id && c.name));
  disc._tried = {};
  console.log('[cats] ' + site.name + ' => ' + disc.cats.length + ' 个分类');
  if (!disc.cats.length) {
    disc.loading = false; disc.done = true;
    renderHome();
    return;
  }
  const hadSnap = disc.list.length > 0;
  const mem = METRICS[site.api] && METRICS[site.api].tid;
  // 有快照就待在用户上次看的分类，别每次开机都把人拉回别的分类
  if (!disc.cats.some(c => String(c.id) === String(disc.tid))) {
    if (pendingTid && disc.cats.some(c => String(c.id) === String(pendingTid))) {
      disc.tid = String(pendingTid);
    } else {
      // 冷启动默认栏目：超英专区（用户指定）
      disc.tid = CAT_HERO.id;
    }
  }
  pendingTid = null;
  disc.page = 1; disc.done = false; disc.loading = false;
  // 有快照就留着旧画面，等新数据回来再替换，避免闪一下空白
  await loadList(true, !hadSnap, hadSnap);
}

    if (HERO_JUNK.test(raw)) return null;
    const s = raw.replace(/[\s\u3000]+/g, '');
    const low = s.toLowerCase();
    for (const it of map) {
      if (!low.startsWith(it.k)) continue;
      const tail = s.slice(it.name.length);
      if (!tail || HERO_SEP.test(tail) || HERO_TAIL_NUM.test(tail) || HERO_TAIL_SEASON.test(tail)) return it;
    }
    return null;
  };
}
// 专区去重：在通用片名归一之上，再剥掉「（短剧版）」「2009」这类版本/年份尾巴，
// 避免同一部片的正片和短剧版、带年份版各占一张卡。
function curatedKey(name) {
  return (heroKey(name) || '')
    .replace(/[（(][^）)]*[）)]/g, '')
    .replace(/(短剧版|电影版|电视剧版|剧场版|完整版|未删减版|加长版|导演剪辑版|重制版|修复版|高清版|国语版|普通话版|粤语版|原声版|中字版|短剧)$/i, '')
    .replace(/版$/, '')
    .replace(/(19\d{2}|20\d{2})$/, '') || normKw(name);
}
const NOLAN_HIT = makeCuratedHit(NOLAN_DB);
const ANI_HIT = { cn: makeCuratedHit(ANI_DB.cn), us: makeCuratedHit(ANI_DB.us), jp: makeCuratedHit(ANI_DB.jp) };
// 国语硬门槛：美/日动画必须片名或备注里明确写了国语/普通话/中文配音；
// 国产动画原声本来就是中文，只需排除明确标了粤语/外语的条目。
const MANDARIN_YES = /国语|普通话|中文配音|中配|国配|台配|中文版/i;
const MANDARIN_NO = /粤语|广东话|英语版|日语版|韩语版|原声版|original/i;
function mandarinOK(v, hard) {
  const s = String(v.vod_name || '') + ' ' + String(v.vod_remarks || '');
  if (MANDARIN_NO.test(s)) return false;
  if (MANDARIN_YES.test(s)) return true;
  return !hard;
}
// 动画卡片保留「国语」字样，让用户一眼确认是中文配音；只剥技术后缀和英文原名。
function aniDisp(name) {
  return String(name || '').replace(/[*＊]+$/, '')
    .replace(/[\s\u3000]*[（(\[]?[A-Za-z][A-Za-z0-9\s&:.'’\-–—!?,;]*[）)\]]?\s*$/, '')
    .replace(/[\s\u3000]*[（(\[]?(HD|TC|TS|BD|4K|2160P|1080P|720P|蓝光|高清|超清|抢先版|枪版)[）)\]]?$/i, '')
    .trim() || String(name || '');
}

// 年份兜底：源站 vod_year 常常是空的，从发布时间/备注/片名里抠
function heroYear(v) {
  const y = Number(v.vod_year) || 0;
  if (y >= 1900) return y;
  const s = String(v.vod_pubdate || '') + ' ' + String(v.vod_time || '') + ' ' +
    String(v.vod_remarks || '') + ' ' + String(v.vod_name || '');
  const m = /(19\d{2}|20\d{2})/.exec(s);
  return m ? Number(m[1]) : 0;
}

/* ---------- 专区通用缓存（超英 / 诺兰 / 三个动画子分类各存一份） ---------- */
function saveZoneCache(key, list) {
  try { localStorage.setItem(key, JSON.stringify({ at: Date.now(), list: (list || []).slice(0, 130) })); } catch (e) {}
}
function readZoneCache(key, keyFn, dispFn) {
  try {
    const j = JSON.parse(localStorage.getItem(key) || 'null');
    if (j && Array.isArray(j.list) && j.list.length) {
      const m = new Map();
      j.list.forEach(v => {
        const k = keyFn(v.name) || normKw(v.name);
        if (!k || !v.id) return;
        const cur = m.get(k);
        if (!cur || (v.y || 0) > (cur.y || 0)) m.set(k, Object.assign({}, v, { name: dispFn(v.name) }));
      });
      if (m.size) j.list = [...m.values()];
      return j;
    }
  } catch (e) {}
  return null;
}
function saveHeroCache(cats, list) { saveZoneCache(HERO_CACHE, list); }
function readHeroCache() { return readZoneCache(HERO_CACHE, heroKey, heroDisp); }

/* ---------- 配置：超英沿用原逻辑；诺兰新→旧；动画按人气顺序、且必须国语 ---------- */

}

async function loadCurated(cfg, reset, keep) {
  const seq = ++heroSeq;
  disc.err = ''; disc.done = false; disc.loading = true; disc.pending = false;
  const cache = (reset && !keep) ? readZoneCache(cfg.cache, cfg.key, cfg.disp) : null;
  if (reset && !keep) disc.list = cache ? cache.list : [];
  const base = disc.list.slice();
  disc.prog = cfg.prog;
  renderHome();
  // 分类被切走 / 又点了一次 / 动画子分类变了，这一批就作废
  const alive = () => seq === heroSeq && String(disc.tid) === String(cfg.id)
    && (cfg.id !== CAT_ANI.id || aniSub === cfg.sub);
  const pool = searchPool().slice(0, 8);
  if (!pool.length) {
    disc.loading = false; disc.done = true; disc.err = '还没有可用的源站';
    renderHome(); return;
  }
  const map = new Map();
  base.forEach(v => {
    const k = cfg.key(v.name);
    if (k && v.id) map.set(k, { id: v.id, name: v.name, pic: v.pic || '', rem: v.rem || '', y: v.y || 0, t: v.t || '', p: v.p || 999, siteKey: v.siteKey });
  });
  const progressive = !base.length;
  const collect = (v, siteKey) => {
    const nm = String(v.vod_name || '').trim();
    if (cfg.mandarin && !mandarinOK(v, true)) return;   // 美/日动画：没写国语一律不要
    if (!cfg.mandarin && !mandarinOK(v, false)) return; // 国产动画：明确粤语/外语的也丢掉
    const hit = cfg.hit(nm);                            // null = 不在白名单里，直接丢
    if (!hit) return;
    const k = cfg.key(nm) || normKw(nm);               // 国语版/普通话版/HD 都算同一部
    if (!k) return;
    const sy = cfg.year(v);
    const y = hit.y && sy > hit.y + 3 ? hit.y : (sy || hit.y);
    const t = String(v.vod_time || v.vod_pubdate || '');
    const dispName = cfg.disp(nm);
    const cur = map.get(k);
    // 排序优先级：片单顺序/年份 →  source 年份 → 更新时间 → 更简洁的片名
    const better = !cur || (cfg.sort === 'pick'
      ? (hit.p < cur.p || (hit.p === cur.p && (y > cur.y || (y === cur.y && t > cur.t))))
      : (y > cur.y || (y === cur.y && (t > cur.t || (t === cur.t && nm.length < cur.name.length)))));
    if (!better) return;
    map.set(k, {
      id: String(v.vod_id), name: dispName, pic: v.vod_pic || '', rem: v.vod_remarks || '',
      y, t, p: hit.p, siteKey
    });
  };
  const jobs = [];
  cfg.kw.forEach((kw, i) => {
    const off = i % Math.max(1, pool.length - 2);
    pool.slice(off, off + 3).forEach(t => jobs.push({ site: t.s, kw }));
  });
  let k = 0, lastPaint = 0;
  const badSite = Object.create(null);
  const sorted = () => [...map.values()].sort((a, b) => cfg.sort === 'pick'
    ? ((a.p || 999) - (b.p || 999)) || (b.y - a.y) || (b.t > a.t ? 1 : (b.t < a.t ? -1 : 0))
    : (b.y - a.y) || (b.t > a.t ? 1 : (b.t < a.t ? -1 : 0)));
  const paint = () => {
    if (!progressive || !alive() || !map.size) return;
    const now = Date.now();
    if (now - lastPaint < 480) return;
    lastPaint = now;
    disc.list = sorted();
    renderHome();
  };
  const worker = async () => {
    while (k < jobs.length && alive()) {
      const jb = jobs[k++];
      const sk = String(jb.site.key);
      if (badSite[sk] >= 2) continue;
      try {
        const j = await getJSON(apiUrl(jb.site.api, 'ac=videolist&wd=' + encodeURIComponent(jb.kw)), 4600);
        badSite[sk] = 0;
        (j.list || []).forEach(v => collect(v, jb.site.key));
        paint();
      } catch (e) { badSite[sk] = (badSite[sk] || 0) + 1; }
    }
  };
  await Promise.all(Array.from({ length: 18 }, worker));
  if (!alive()) {
    if (String(disc.tid) !== String(cfg.id)) disc.loading = false;
    return;
  }
  const list = sorted();
  console.log('[' + cfg.label + '] ' + list.length + ' 部 / ' + jobs.length + ' 请求');
  disc.list = list;
  disc.loading = false; disc.done = true; disc.prog = '';
  const prev = readZoneCache(cfg.cache, cfg.key, cfg.disp);
  if (list.length >= cfg.minKeep && (!prev || list.length >= prev.list.length * 0.7)) saveZoneCache(cfg.cache, list);
  renderHome();
}
function loadHeroList(reset, keep) { return loadCurated(CFG_HERO, reset, keep); }

async function loadList(reset, allowSkip, keep) {
  const picked = !!disc.userPick; disc.userPick = false;   // 本次是否是用户手点分类
  if (String(disc.tid) === CAT_HERO.id) return loadHeroList(reset, keep);
  if (String(disc.tid) === CAT_NOLAN.id) return loadCurated(CFG_NOLAN, reset, keep);
  if (String(disc.tid) === CAT_ANI.id) return loadCurated(aniCfg(aniSub), reset, keep);
  disc.prog = '';                 // 普通分类不用超英那句提示语
  disc.pending = false;
  const site = curSite();
  if (!site || disc.loading) return;
  disc.loading = true;
  if (reset && !keep) { disc.list = []; disc.done = false; }
  if (reset && !allowSkip) disc._skip = 0;
  if (!keep || !disc.list.length) renderHome();
  try {
    const qs = 'ac=videolist&t=' + encodeURIComponent(disc.tid) + '&pg=' + disc.page;
    let j = null;
    const pf = (reset && disc.page === 1) ? takePrefetch(site, 1) : null;
    if (pf) { j = await pf; if (j) console.log('[list] 命中首屏预取'); }
    if (!j) j = await getJSON(apiUrl(site.api, qs), 8000);
    const list = (j.list || []).map(v => ({
      id: String(v.vod_id),
      name: v.vod_name || '',
      pic: v.vod_pic || '',
      rem: v.vod_remarks || '',
      y: Number(v.vod_year) || 0,
      t: String(v.vod_time || v.vod_pubdate || '')
    })).filter(v => v.id && v.name);
    console.log('[list] ' + site.name + ' t=' + disc.tid + ' pg=' + disc.page + ' => ' + list.length + ' 条');
    // 仅"自动进入"时，若首屏分类为空才往后跳；用户手动点分类必须原地不动
    if (allowSkip && reset && list.length < 4 && disc.cats.length > 1) {
      const idx = disc.cats.findIndex(c => String(c.id) === String(disc.tid));
      const skipped = disc._skip || 0;
      if (idx >= 0 && idx + 1 < disc.cats.length && skipped < 6) {
        disc._skip = skipped + 1;
        disc.tid = disc.cats[idx + 1].id;
        disc.loading = false;
        console.log('[list] 该分类为空，自动跳到 ' + disc.cats[idx + 1].name);
        return loadList(true, true);
      }
    }
    if (reset && keep && !list.length && disc.list.length) {
      // 这个源在这个分类下没片：先留着旧画面，再去别的分类找有货的，别怼个"这里是空的"给用户
      disc.loading = false; disc.done = false;
      console.log('[list] 该分类在此源为空，保留缓存画面');
      recoverCat();
      return;
    }
      // 开机默认分类是空的（有的源"电影片"这类目就是空的）：自动找个有货的分类顶上
    // 但用户亲手点的分类，空就空着，绝不把人拽到别的栏目去
    if (reset && !list.length && !allowSkip && !picked) {
      disc.loading = false;
      const alt = await findNonEmptyCat();
      if (alt && alt !== disc.tid) {
        console.log('[list] 默认分类空，自动切到 ' + alt);
        disc.tid = alt;
        return loadList(true, true);
      }
      disc.loading = true;
    }
    disc.list = reset ? list : disc.list.concat(list);
    // 按上映时间从新到旧：源站的顺序经常是乱的/按上架时间，这里统一把新片顶到前面
    if (disc.list.length > 1 && disc.list.some(v => v.y > 0)) {
      disc.list.sort((a, b) => (b.y || 0) - (a.y || 0) || (b.t > a.t ? 1 : (b.t < a.t ? -1 : 0)));
    }
    if (reset && disc.list.length) saveSnap(site, disc.tid, disc.list, disc.cats);
    const pc = Number(j.pagecount || 0);
    disc.done = list.length === 0 || (pc > 0 && disc.page >= pc);
    disc.err = '';
  } catch (e) {
    disc.err = e.message || '请求失败';
    disc.done = true;
    console.log('[list] FAIL ' + site.name + ' : ' + disc.err);
  }
  disc.loading = false;
  renderHome();
}

// 默认分类空的时候：并发探几个分类，谁有片就用谁（每个分类只探一次，不会死循环）
async function findNonEmptyCat() {
  const site = curSite();
  if (!site) return null;
  disc._tried = disc._tried || {};
  disc._tried[String(disc.tid)] = 1;
  const cands = disc.cats.filter(c => !disc._tried[String(c.id)]).slice(0, 4);
  if (!cands.length) return null;
  const res = await Promise.all(cands.map(async c => {
    try {
      const j = await getJSON(apiUrl(site.api, 'ac=videolist&t=' + encodeURIComponent(c.id) + '&pg=1'), 6000);
      return { id: String(c.id), n: (j.list || []).length };
    } catch (e) { return { id: String(c.id), n: 0 }; }
  }));
  const hit = res.find(r => r.n >= 4) || res.find(r => r.n > 0);
  return hit ? hit.id : null;
}

// 当前分类在这个源里是空的：往后试几个分类，找到有货的就换过去（画面不闪空）
let recoveringCat = false;
async function recoverCat() {
  if (recoveringCat) return;
  recoveringCat = true;
  const site = curSite();
  const n = disc.cats.length;
  const idx = disc.cats.findIndex(c => String(c.id) === String(disc.tid));
  const order = [];
  for (let i = 1; i < n && order.length < 4; i++) {
    const c = disc.cats[(idx + i + n) % n];
    if (c && String(c.id) !== String(disc.tid)) order.push(c);
  }
  for (let i = 0; i < order.length; i++) {
    const c = order[i];
    try {
      const j = await getJSON(apiUrl(site.api, 'ac=videolist&t=' + encodeURIComponent(c.id) + '&pg=1'), 6000);
      if ((j.list || []).length >= 4) {
        console.log('[list] 换到有货的分类 ' + c.name);
        disc.tid = String(c.id); disc.page = 1; disc.loading = false;
        recoveringCat = false;
        await loadList(true, false, true);
        return;
      }
    } catch (e) {}
  }
  recoveringCat = false;
  renderHome();
}

/* ---------- 站点选择 ---------- */
let sitesOnlyOk = true;
let siteSort = 'def';
function openSites() {
  const f = $('#siteFilter');
  if (f) f.value = '';
  renderSites('');
  $('#maskSites').classList.add('on');
}
function renderSites(q) {
  const kw = (q || '').toLowerCase();
  const items = [];
  state.warehouses.forEach(w => {
    w.sites.forEach(s => {
      if (kw && s.name.toLowerCase().indexOf(kw) < 0) return;
      if (sitesOnlyOk && !s.ok) return;
      items.push({ w, s });
    });
  });
  if (siteSort === 'def') {
    // 默认把"测过且又快又清晰"的排前面，没测过的保持原序排在后面
    items.forEach((it, i) => {
      const m = METRICS[it.s.api];
      it._k = m ? (m.speed || 0) * 100 + (m.mbps || 0) : -1;
      it._i = i;
    });
    items.sort((a, b) => (b._k - a._k) || (a._i - b._i));
  } else if (siteSort === 'speed') {
    items.sort((a, b) => {
      const ma = METRICS[a.s.api] || {}, mb = METRICS[b.s.api] || {};
      return (mb.speed || 0) - (ma.speed || 0) || (ma.ttfb || 9e9) - (mb.ttfb || 9e9);
    });
  } else if (siteSort === 'q') {
    items.sort((a, b) => {
      const ma = METRICS[a.s.api] || {}, mb = METRICS[b.s.api] || {};
      return (mb.mbps || 0) - (ma.mbps || 0) || (ma.ttfb || 9e9) - (mb.ttfb || 9e9);
    });
  }
  // 正在用的源永远置顶，免得排在底下找不到
  items.sort((a, b) => {
    const aa = state.activeWh === a.w.id && String(state.site) === String(a.s.key) ? 0 : 1;
    const bb = state.activeWh === b.w.id && String(state.site) === String(b.s.key) ? 0 : 1;
    return aa - bb;
  });
  const rows = items.map(({ w, s }) => {
    const active = state.activeWh === w.id && String(state.site) === String(s.key);
    const m = METRICS[s.api];
    const extra = m ? metricBadges(m) : '';
    return `<button class="whrow ${active ? 'on' : ''}" data-wid="${w.id}" data-key="${esc(s.key)}" ${s.ok ? '' : 'data-dead="1" style="opacity:.42"'}>
      <span class="wi">${esc(s.name.slice(0, 1))}</span>
      <span class="wt"><b>${esc(s.name)}</b><small>${s.ok ? esc(w.name) : '需要爬虫引擎，暂不支持'}${extra}</small></span>
      ${active ? '<span class="row-val">使用中</span>' : ''}
    </button>`;
  });
  $('#sitesBody').innerHTML = rows.length ? rows.join('')
    : `<div class="empty-sm">${sitesOnlyOk ? '这个仓库里没有可直接播的源站<br>关掉「只看可用」可以看到全部' : '还没有可用的源站<br>先去「仓库」添加一个接口地址'}</div>`;
  $$('#sitesBody .whrow').forEach(b => b.onclick = () => {
    if (b.dataset.dead) return toast('这个源依赖爬虫引擎，当前版本播不了');
    const w = state.warehouses.find(x => x.id === b.dataset.wid);
    const s = w && w.sites.find(x => String(x.key) === b.dataset.key);
    if (w && s) activate(w, s);
  });
}

/* 给源站逐个测码率/速度，结果写进 METRICS 并在列表里显示 */
let measuring = false;
async function measureAllSites() {
  if (measuring) return;
  const seen = {}, todo = [];
  state.warehouses.forEach(w => w.sites.forEach(s => {
    if (!s.ok || seen[s.api]) return;
    seen[s.api] = 1;
    const m = METRICS[s.api];
    if (!m || Date.now() - (m.at || 0) > 6 * 3600 * 1000) todo.push(s);
  }));
  if (!todo.length) {
    $('#siteTip').textContent = '都已测过，切到「排序：速度 / 清晰度」看结果';
    return toast('这些源刚测过，不用重复');
  }
  const list = todo.slice(0, 24);
  measuring = true;
  let done = 0, hit = 0;
  $('#siteSpeed').classList.add('on');
  const tick = () => {
    $('#siteTip').textContent = '测速中 ' + done + '/' + list.length + (hit ? ' · 成功 ' + hit : '');
  };
  tick();
  const queue = list.slice();
  const worker = async () => {
    while (queue.length) {
      const s = queue.shift();
      try {
        const j = await getJSON(apiUrl(s.api, 'ac=videolist&pg=1'), 7000);
        const v = (j.list || [])[0];
        let pu = v ? String(v.vod_play_url || '') : '';
        if (v && !/\.(m3u8|mp4)/i.test(pu)) {
          const d = await getJSON(apiUrl(s.api, 'ac=videolist&ids=' + v.vod_id), 7000);
          pu = String(((d.list || [])[0] || {}).vod_play_url || '');
        }
        // 分享页线路没有 .m3u8 字样，先解一层再量
        const raw = (pu.match(/https?:\/\/[^\s$#]+/i) || [])[0];
        const u = raw ? await resolvePlayUrl(raw) : '';
        if (/\.m3u8/i.test(u)) {
          const m = await measureStream(u);
          if (m && (m.mbps || m.res)) {
            m.at = Date.now();
            METRICS[s.api] = Object.assign({}, METRICS[s.api] || {}, m);
            hit++;
          }
        }
      } catch (e) {}
      done++;
      if (done % 3 === 0) { tick(); saveMetrics(); renderSites($('#siteFilter').value); }
    }
  };
  await Promise.all([worker(), worker(), worker(), worker()]);
  saveMetrics();
  measuring = false;
  $('#siteSpeed').classList.remove('on');
