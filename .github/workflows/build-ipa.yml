name: Build IPA

# 用 GitHub 免费 macOS 机器编译出 unsigned .ipa，下载后自行签名安装。
# 触发方式：网页上点 Run workflow，或向仓库 push 任意改动。
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译（不签名）
        run: |
          xcodebuild \
            -project LanJueTV.xcodeproj \
            -target LanJueTV \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 打包成 ipa
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "APP=$APP"
          rm -rf Payload LanJueTV.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry LanJueTV.ipa Payload
          ls -lh LanJueTV.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: LanJueTV-unsigned-ipa
          path: LanJueTV.ipa
          retention-days: 30
